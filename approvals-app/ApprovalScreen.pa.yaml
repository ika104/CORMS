Screens:
  ApprovalScreen:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Select(btnLoad)
    Children:
      - btnLoad:
          Control: ModernButton
          Properties:
            AccessibleLabel: ="Load the approval task"
            Height: =1
            OnSelect: |-
              =Set(varBusy, true);
              Set(varPanelError, "");
              Set(varSigningUrl, "");
              Set(varPanelActionIn, "");
              Set(varLastActionAt, "");
              Clear(colAuditQueue);
              // The user's email and claim as SharePoint stores them, for the queries below.
              Set(varMyEmail, Lower(User().Email));
              Set(varMyClaims, "i:0#.f|membership|" & varMyEmail);
              Set(varMyName, User().FullName);
              // The user's unit in CORMS_UserRoles; a team task belongs to everyone in that unit.
              Set(varMyDepartment, Lower(Trim(LookUp(CORMS_UserRoles, User.Email = varMyEmail).Department)));
              // Delegations the user may act under today (CORMS supporting rule 1).
              Set(
                  varMyDelegations,
                  Filter(
                      CORMS_Delegations,
                      Status.Value = "Active",
                      StartDate <= Today(),
                      EndDate >= Today(),
                      Delegate.Email = varMyEmail
                  )
              );
              // The task to open: &approvalTaskId= (or &taskId=); else the user's own pending task on
              // &correspondenceId=; else the user's own oldest pending task. Never someone else's.
              Set(varTaskId, Value(Coalesce(Param("approvalTaskId"), Param("taskId"), "0")));
              Set(
                  varCorrId,
                  If(
                      varTaskId > 0,
                      Text(LookUp(CORMS_ApprovalTasks, ID = varTaskId).CorrespondenceId),
                      Coalesce(Param("correspondenceId"), "")
                  )
              );
              If(
                  varTaskId = 0 && IsBlank(varCorrId),
                  Set(
                      varCorrId,
                      Text(
                          First(
                              Sort(
                                  Filter(
                                      CORMS_ApprovalTasks,
                                      Status.Value = "Pending" && (
                                          AssignedToId = varMyClaims ||
                                          AssignedToId = varMyEmail ||
                                          AssignedToName = varMyName
                                      )
                                  ),
                                  StepOrder
                              )
                          ).CorrespondenceId
                      )
                  )
              );
              // Only the latest round counts: a Return or Reject starts a new one.
              ClearCollect(colAllSteps, Filter(CORMS_ApprovalTasks, CorrespondenceId = varCorrId));
              Set(varLatestRound, Coalesce(Max(colAllSteps, Coalesce(Round, 1)), 1));
              ClearCollect(colSteps, Filter(colAllSteps, Coalesce(Round, 1) = varLatestRound));
              If(
                  varTaskId = 0,
                  Set(
                      varTaskId,
                      Coalesce(
                          First(
                              Sort(
                                  Filter(
                                      colSteps As t,
                                      t.Status.Value = "Pending" && (
                                          fxIsAssignee(t.AssignedToId, t.AssignedToName) || (
                                              IsBlank(t.AssignedToId) && IsBlank(t.AssignedToName) && IsBlank(t.AssignedGroupId) &&
                                              !IsBlank(varMyDepartment) && Lower(Trim(t.AssignedToTeam)) = varMyDepartment
                                          ) ||
                                          CountRows(
                                              Filter(
                                                  varMyDelegations As d,
                                                  fxMatches(t.AssignedToId, t.AssignedToName, d.Delegator.Email, d.Delegator.DisplayName)
                                              )
                                          ) > 0
                                      )
                                  ),
                                  StepOrder
                              )
                          ).ID,
                          0
                      )
                  )
              );
              Set(varTask, LookUp(colAllSteps, ID = varTaskId));
              // The delegation the user would act under for this task, when it isn't theirs.
              Set(
                  varDelegationUsed,
                  If(
                      fxIsAssignee(varTask.AssignedToId, varTask.AssignedToName),
                      Blank(),
                      First(
                          Filter(
                              varMyDelegations As d,
                              fxMatches(varTask.AssignedToId, varTask.AssignedToName, d.Delegator.Email, d.Delegator.DisplayName)
                          )
                      )
                  )
              );
              Set(varHasDelegation, !IsBlank(varDelegationUsed.ID));
              Set(varCorr, LookUp(CORMS_Correspondence, ID = Value(varCorrId)));
              // Signing and notification settings: the same rows CORMS reads.
              Set(varFlowUrl, LookUp(CORMS_AdminConfig, Title = "signature.flowUrl").Value);
              Set(varNotifyUrl, LookUp(CORMS_AdminConfig, Title = "notification.flowUrl").Value);
              Set(varTeamsId, Coalesce(LookUp(CORMS_AdminConfig, Title = "notification.teamsTeamId").Value, ""));
              // Auditing goes to the CORMS audit index (Elasticsearch), the same settings CORMS uses.
              // integration.auditingEnabled = false turns all auditing off, as it does in CORMS.
              // A blank integration.elasticEndpoint is passed on as blank: the audit flow then uses
              // the corms_ElasticEndpoint environment variable (UAT-006).
              Set(varAuditEndpoint, Trim(Coalesce(LookUp(CORMS_AdminConfig, Title = "integration.elasticEndpoint").Value, "")));
              Set(varAuditIndex, Coalesce(Trim(LookUp(CORMS_AdminConfig, Title = "integration.elasticAuditIndex").Value), "sslaudit"));
              Set(varAuditKey, Trim(Coalesce(LookUp(CORMS_AdminConfig, Title = "integration.elasticApiKey").Value, "")));
              Set(varAuditOn, Lower(Trim(Coalesce(LookUp(CORMS_AdminConfig, Title = "integration.auditingEnabled").Value, ""))) <> "false");
              Set(varSiteUrl, fxSiteUrl);
              // The signing session returns to a blank page on the SharePoint host.
              Set(varReturnUrl, fxTenantUrl & "/_layouts/15/images/blank.gif?cormsSigning=1");
              // The document to sign: the main letter, else the first attachment.
              Set(varMainDoc, LookUp(CORMS_Attachments, CorrespondenceId = varCorrId && IsMainLetter = true));
              If(
                  IsBlank(varMainDoc.ID),
                  Set(varMainDoc, First(Sort(Filter(CORMS_Attachments, CorrespondenceId = varCorrId), ID)))
              );
              Set(varBusy, false);
              // Start reading the panel's actions once the task is loaded.
              Set(varPanelTimerOn, true)
            Visible: =false
            Width: =1
            X: =-200
            Y: =-200
      - tmrPanel:
          Control: Timer
          Properties:
            Duration: =300
            Height: =1
            OnTimerEnd: |-
              =// The panel reports what the user chose through Action (JSON). Its timestamp changes on
              // every report, so one action is handled once.
              Set(varAct, If(IsBlank(ApprovalPanel7.Action), Blank(), ParseJSON(ApprovalPanel7.Action)));
              Set(varActAt, Text(varAct.at));
              If(
                  !IsBlank(varActAt) && varActAt <> varLastActionAt,
                  Set(varLastActionAt, varActAt);
                  Set(varComment, Text(varAct.comment));
                  Switch(
                      Text(varAct.action),
                      "Approve", Set(varOutcome, "Approved"); Set(varDecideNow, true),
                      "Reject", Set(varOutcome, "Rejected"); Set(varDecideNow, true),
                      "Return", Set(varOutcome, "Returned"); Set(varDecideNow, true),
                      "RequestSignature",
                          Set(varBusy, true);
                          Set(varPanelError, "");
                          If(
                              IsBlank(varFlowUrl),
                                  Trace("Signing: signature.flowUrl is not set in CORMS_AdminConfig", TraceSeverity.Error);
                                  Set(varPanelError, "Signing isn't set up yet. Please contact your administrator."),
                              IsBlank(varMainDoc.ID),
                                  Set(varPanelError, "This correspondence has no document to sign."),
                              Set(
                                  varSignRes,
                                  IfError(
                                      'CORMS-SigningBridge'.Run(
                                          varFlowUrl,
                                          "CreateSigningRequest",
                                          {
                                              text_3: varCorrId,
                                              text_4: Coalesce(varCorr.ReferenceNo, ""),
                                              text_5: Coalesce(varCorr.Title, ""),
                                              text_6: varMainDoc.'File name with extension',
                                              text_7: varMainDoc.'Full Path',
                                              text_8: varActorName,
                                              text_9: Lower(User().Email),
                                              text_10: varReturnUrl,
                                              text_11: Coalesce(varTask.SignaturePlacement, "")
                                          }
                                      ),
                                      Trace("Signing: the Signing Bridge could not be called", TraceSeverity.Error, {error: FirstError.Message});
                                      {contentbase64: "", error: "ProviderUnavailable", externaldocumentid: "", iscompleted: "false", signingurl: "", status: ""}
                                  )
                              );
                              If(
                                  !IsBlank(varSignRes.error),
                                      Trace("Signing: CreateSigningRequest failed", TraceSeverity.Error, {error: varSignRes.error});
                                      Set(varPanelError, fxSigningMessage(varSignRes.error)),
                                  IsBlank(varSignRes.signingurl),
                                      Trace("Signing: CreateSigningRequest returned no signing link", TraceSeverity.Error);
                                      Set(varPanelError, fxSigningMessage("")),
                                  Patch(
                                      CORMS_ApprovalTasks,
                                      LookUp(CORMS_ApprovalTasks, ID = varTaskId),
                                      {
                                          SignatureExternalDocumentId: varSignRes.externaldocumentid,
                                          SignatureRequestedAt: Now(),
                                          SignatureRequestedBy: varActorName
                                      }
                                  );
                                  // Audit, worded as CORMS words it (approvalTaskActions.ts).
                                  Collect(
                                      colAuditQueue,
                                      {
                                          ts: DateAdd(Now(), CountRows(colAuditQueue), TimeUnit.Milliseconds),
                                          objectId: varCorrId,
                                          action: "Approval signature requested",
                                          details: "Step " & varTask.StepOrder & " (" & varTask.StepName & ") signing request created by " &
                                              nfActorLabel & " — external document " & varSignRes.externaldocumentid
                                      }
                                  );
                                  Patch(
                                      CORMS_Timeline,
                                      Defaults(CORMS_Timeline),
                                      {
                                          Title: "Signature requested",
                                          CorrespondenceId: varCorrId,
                                          Actor: fxMe,
                                          EventTimestamp: Now(),
                                          EventType: {Value: "SignatureRequested"},
                                          Description: "Step " & varTask.StepOrder & " (" & varTask.StepName &
                                              ") sent for signature as " & varMainDoc.'File name with extension'
                                      }
                                  );
                                  // One row per signing request, for the signing dashboard (CMS-007).
                                  Patch(
                                      CORMS_SigningSessions,
                                      Defaults(CORMS_SigningSessions),
                                      {
                                          Title: Coalesce(varCorr.ReferenceNo, varCorrId),
                                          CorrespondenceId: varCorrId,
                                          ReferenceNo: Coalesce(varCorr.ReferenceNo, ""),
                                          Subject: Coalesce(varCorr.Title, ""),
                                          SignerName: varActorName,
                                          SignerEmail: Lower(User().Email),
                                          ExternalDocumentId: varSignRes.externaldocumentid,
                                          Status: {Value: "Sent"},
                                          SentAt: Now()
                                      }
                                  );
                                  ClearCollect(colAllSteps, Filter(CORMS_ApprovalTasks, CorrespondenceId = varCorrId));
                                  ClearCollect(colSteps, Filter(colAllSteps, Coalesce(Round, 1) = varLatestRound));
                                  Set(varTask, LookUp(colAllSteps, ID = varTaskId));
                                  Set(varPollCount, 0);
                                  Set(varSigningUrl, varSignRes.signingurl)
                              )
                          );
                          Set(varBusy, false),
                      // The user asked to check again: ask the provider now.
                      "SigningEnded", Set(varPollNow, true),
                      // Only used when the panel has no correspondence link; a new tab, never this frame.
                      "OpenCorrespondence", Launch(varSiteUrl & "#/correspondence/" & varCorrId, {}, LaunchTarget.New)
                  )
              );
              // While a signing session is open, ask the provider whether it is done: every 50 ticks
              // (about 15 s at 300 ms), at most 40 times, or straight away when the user asks.
              Set(varTick, Mod(Coalesce(varTick, 0) + 1, 1000));
              If(
                  (
                      varPollNow ||
                      (!IsBlank(varSigningUrl) && IsBlank(varTask.SignatureCompletedAt) && Coalesce(varPollCount, 0) < 40 && Mod(varTick, 50) = 0)
                  ) && !IsBlank(varTask.SignatureExternalDocumentId),
                  Set(varPollManual, varPollNow);
                  Set(varPollNow, false);
                  Set(varPollCount, If(varPollManual, 0, Coalesce(varPollCount, 0) + 1));
                  If(varPollManual, Set(varBusy, true); Set(varPanelError, ""));
                  Set(
                      varStatusRes,
                      IfError(
                          'CORMS-SigningBridge'.Run(varFlowUrl, "GetSigningStatus", {text_2: varTask.SignatureExternalDocumentId}),
                          Trace("Signing: GetSigningStatus could not be called", TraceSeverity.Error, {error: FirstError.Message});
                          {contentbase64: "", error: "ProviderUnavailable", externaldocumentid: "", iscompleted: "false", signingurl: "", status: ""}
                      )
                  );
                  If(
                      !IsBlank(varStatusRes.error),
                          Trace("Signing: GetSigningStatus failed", TraceSeverity.Warning, {error: varStatusRes.error});
                          If(varPollManual, Set(varPanelError, fxSigningMessage(varStatusRes.error))),
                      varStatusRes.iscompleted <> "true",
                          If(varPollManual, Set(varPanelError, "Your signature hasn't been confirmed yet. If you finished signing, try again in a moment.")),
                      // Signed: save the signed file over the main document before anything is recorded.
                      Set(
                          varSignedRes,
                          IfError(
                              'CORMS-SigningBridge'.Run(
                                  varFlowUrl,
                                  "GetSignedDocument",
                                  {
                                      text_2: varTask.SignatureExternalDocumentId,
                                      text_6: varMainDoc.'File name with extension',
                                      text_7: varMainDoc.'Full Path'
                                  }
                              ),
                              Trace("Signing: GetSignedDocument could not be called", TraceSeverity.Error, {error: FirstError.Message});
                              {contentbase64: "", error: "ProviderUnavailable", externaldocumentid: "", iscompleted: "false", signingurl: "", status: ""}
                          )
                      );
                      If(
                          // The signed file must be saved before the step can count as signed.
                          !IsBlank(varSignedRes.error),
                              Trace("Signing: GetSignedDocument failed", TraceSeverity.Error, {error: varSignedRes.error});
                              Set(varPanelError, fxSigningMessage(varSignedRes.error)),
                          // A signed Word document is saved as a new PDF beside it (CORMS - Signing Bridge),
                          // so read the main document again: the audit entry and the next signer get the PDF.
                          Refresh(CORMS_Attachments);
                          Set(
                              varMainDoc,
                              Coalesce(LookUp(CORMS_Attachments, CorrespondenceId = varCorrId && IsMainLetter = true), varMainDoc)
                          );
                          Patch(
                              CORMS_ApprovalTasks,
                              LookUp(CORMS_ApprovalTasks, ID = varTaskId),
                              {SignatureCompletedBy: varActorName, SignatureCompletedAt: Now()}
                          );
                          Set(varSession, LookUp(CORMS_SigningSessions, ExternalDocumentId = varTask.SignatureExternalDocumentId));
                          If(
                              !IsBlank(varSession.ID),
                              Patch(CORMS_SigningSessions, varSession, {Status: {Value: "Signed"}, SignedAt: Now()})
                          );
                          // CORMS records saving the signed file first, then the verified signature.
                          Collect(
                              colAuditQueue,
                              {
                                  ts: DateAdd(Now(), CountRows(colAuditQueue), TimeUnit.Milliseconds),
                                  objectId: varCorrId,
                                  action: "Signed Document Saved",
                                  details: "Signed version saved as the main document: " & varMainDoc.'File name with extension'
                              }
                          );
                          Collect(
                              colAuditQueue,
                              {
                                  ts: DateAdd(Now(), CountRows(colAuditQueue), TimeUnit.Milliseconds),
                                  objectId: varCorrId,
                                  action: "Approval signature completed",
                                  details: "Step " & varTask.StepOrder & " (" & varTask.StepName &
                                      ") signature verified for external document " & varTask.SignatureExternalDocumentId
                              }
                          );
                          Patch(
                              CORMS_Timeline,
                              Defaults(CORMS_Timeline),
                              {
                                  Title: "Signed",
                                  CorrespondenceId: varCorrId,
                                  Actor: fxMe,
                                  EventTimestamp: Now(),
                                  EventType: {Value: "Signed"},
                                  Description: "Step " & varTask.StepOrder & " (" & varTask.StepName & ") signature verified"
                              }
                          );
                          ClearCollect(colAllSteps, Filter(CORMS_ApprovalTasks, CorrespondenceId = varCorrId));
                          ClearCollect(colSteps, Filter(colAllSteps, Coalesce(Round, 1) = varLatestRound));
                          Set(varTask, LookUp(colAllSteps, ID = varTaskId));
                          Set(varSigningUrl, "");
                          // One click: the approver already chose Approve before signing.
                          Set(varOutcome, "Approved");
                          Set(varDecideNow, true)
                      )
                  );
                  If(varPollManual, Set(varBusy, false))
              );
              // The decision itself - from a button, or straight after signing.
              If(
                  varDecideNow,
                  Set(varDecideNow, false);
                  Set(varBusy, true);
                  Set(varPanelError, "");
                  // Read the task as it is now, not as it was when the panel opened (spec rule 4.1).
                  Set(varTaskNow, LookUp(CORMS_ApprovalTasks, ID = varTaskId));
                  If(
                      Text(varTaskNow.Status.Value) <> "Pending",
                          Set(varPanelError, "This task has already been decided.");
                          ClearCollect(colAllSteps, Filter(CORMS_ApprovalTasks, CorrespondenceId = varCorrId));
                          ClearCollect(colSteps, Filter(colAllSteps, Coalesce(Round, 1) = varLatestRound));
                          Set(varTask, LookUp(colAllSteps, ID = varTaskId)),
                      varOutcome = "Approved" && varTaskNow.RequireSignature && IsBlank(varTaskNow.SignatureCompletedAt),
                          Set(varPanelError, "Please sign the document before approving."),
                      IsBlank(Trim(varComment)),
                          Set(varPanelError, "Please enter a comment."),
                      !nfCanAct,
                          Set(varPanelError, "You can't act on this task."),
                      // Captured before the write, while the task is still the user's turn.
                      Set(varDelegate, nfIsDelegate);
                      Set(varDelegation, varDelegationUsed);
                      Set(varActorText, nfActorLabel);
                      // A delegate's decision is recorded as CORMS records it (supporting rule 1 / R3).
                      Patch(
                          CORMS_ApprovalTasks,
                          varTaskNow,
                          {
                              Status: {Value: varOutcome},
                              DecisionComment: Trim(varComment),
                              DecidedBy: User().FullName,
                              DecidedOnBehalfOf: If(varDelegate, varDelegation.Delegator.DisplayName, ""),
                              DelegationDetails: If(
                                  varDelegate,
                                  JSON(
                                      {
                                          delegatorName: varDelegation.Delegator.DisplayName,
                                          delegateName: User().FullName,
                                          delegationId: Text(varDelegation.ID),
                                          startDate: Text(varDelegation.StartDate, "yyyy-mm-dd"),
                                          endDate: Text(varDelegation.EndDate, "yyyy-mm-dd"),
                                          reason: Coalesce(varDelegation.Reason, "")
                                      },
                                      JSONFormat.IgnoreUnsupportedTypes
                                  ),
                                  ""
                              ),
                              DecidedAt: Now()
                          }
                      );
                      // A Reject or a Return ends the round: nobody acts on what is left (rule 4.3).
                      If(
                          varOutcome = "Rejected" || varOutcome = "Returned",
                          Patch(
                              CORMS_ApprovalTasks,
                              ForAll(
                                  Filter(colAllSteps, Status.Value = "Pending" && ID <> varTaskId) As t,
                                  {ID: t.ID, Status: {Value: "Cancelled"}, DecidedAt: Now()}
                              )
                          )
                      );
                      ClearCollect(colAllSteps, Filter(CORMS_ApprovalTasks, CorrespondenceId = varCorrId));
                      ClearCollect(colSteps, Filter(colAllSteps, Coalesce(Round, 1) = varLatestRound));
                      Set(varTask, LookUp(colAllSteps, ID = varTaskId));
                      Patch(
                          CORMS_Correspondence,
                          LookUp(CORMS_Correspondence, ID = Value(varCorrId)),
                          {Status: {Value: nfCorrStatus}}
                      );
                      Set(varCorr, LookUp(CORMS_Correspondence, ID = Value(varCorrId)));
                      Set(varStepNow, LookUp(nfChain, stepOrder = varTask.StepOrder).status);
                      // Worded as CORMS words it: "step approved", "asked for a change" in a signing round.
                      Set(
                          varDecisionText,
                          "Step " & varTask.StepOrder & " (" & varTask.StepName & ") " &
                          If(varOutcome = "Returned" && Text(varTask.Phase.Value) = "Signing", "asked for a change", Lower(varOutcome)) &
                          " by " & varActorText & " — " & Trim(varComment) & " · step " & Lower(varStepNow)
                      );
                      // Audit, with the delegation a delegate acted under (delegationAuditText).
                      Collect(
                          colAuditQueue,
                          {
                              ts: DateAdd(Now(), CountRows(colAuditQueue), TimeUnit.Milliseconds),
                              objectId: varCorrId,
                              action: "Approval " & varOutcome,
                              details: varDecisionText &
                                  If(
                                      !varDelegate,
                                      "",
                                      " — Delegate " & User().FullName & " for " & varDelegation.Delegator.DisplayName &
                                      " under delegation #" & varDelegation.ID &
                                      If(IsBlank(Trim(varDelegation.Reason)), "", " """ & Trim(varDelegation.Reason) & """") &
                                      ", " & Coalesce(Text(varDelegation.StartDate, "dd/mm/yyyy"), "…") &
                                      " to " & Coalesce(Text(varDelegation.EndDate, "dd/mm/yyyy"), "…")
                                  )
                          }
                      );
                      // The Timeline heading CORMS gives a decision (decisionTimelineEventType).
                      Patch(
                          CORMS_Timeline,
                          Defaults(CORMS_Timeline),
                          {
                              Title: "Approval " & varOutcome,
                              CorrespondenceId: varCorrId,
                              Actor: fxMe,
                              EventTimestamp: Now(),
                              EventType: {
                                  Value: If(
                                      varDelegate, "Delegated",
                                      varOutcome = "Returned", "Returned",
                                      varOutcome = "Rejected", "Rejected",
                                      Text(varTask.Phase.Value) = "Review", "Reviewed",
                                      Text(varTask.Phase.Value) = "Signing" || varTask.RequireSignature, "Signed",
                                      "Approved"
                                  )
                              },
                              Description: varDecisionText
                          }
                      );
                      // The last approval of a round closes it, recorded after the step so it sorts last.
                      If(
                          varOutcome = "Approved" && nfOutcomeNow = "Approved",
                          Patch(
                              CORMS_Timeline,
                              Defaults(CORMS_Timeline),
                              {
                                  Title: "Approved",
                                  CorrespondenceId: varCorrId,
                                  Actor: fxMe,
                                  EventTimestamp: DateAdd(Now(), 1, TimeUnit.Seconds),
                                  EventType: {Value: "Approved"},
                                  Description: Switch(
                                      nfPhase,
                                      "Review", "Review complete — awaiting the author’s final confirmation",
                                      "Signing", "Signed — every signer has signed",
                                      "Correspondence approved — all approval steps complete"
                                  )
                              }
                          )
                      );
                      // Notifications go through the CORMS notification flow. A notification that
                      // fails never undoes or blocks the decision; it is only traced.
                      Set(
                          varNotifyPeople,
                          Filter(
                              Table(
                                  {email: Lower(Coalesce(varCorr.'Created By'.Email, "")), name: Coalesce(varCorr.'Created By'.DisplayName, ""), role: "Recipient"},
                                  {email: Lower(Coalesce(varCorr.AssignedTo.Email, "")), name: Coalesce(varCorr.AssignedTo.DisplayName, ""), role: "Recipient"}
                              ),
                              !IsBlank(email)
                          )
                      );
                      // Created By and Assigned To are often the same person; notify them once.
                      Set(
                          varNotifyPeople,
                          If(
                              CountRows(varNotifyPeople) = 2 && First(varNotifyPeople).email = Last(varNotifyPeople).email,
                              Table(First(varNotifyPeople)),
                              varNotifyPeople
                          )
                      );
                      Set(
                          varNotifySummary,
                          Switch(
                              nfCorrStatus,
                              "Returned to Author",
                                  "Returned to you: " & varActorText & " sent it back: " & Trim(varComment) &
                                  ". Edit it and send it for review or for signing.",
                              "Awaiting Final Confirmation",
                                  "Final confirmation: All reviewers approved. Confirm it's final and send it to the signers.",
                              "Change Requested",
                                  "Change requested: " & varActorText & " asked for a change: " & Trim(varComment) &
                                  ". The signatures so far no longer stand. Edit it and send it for signing or for review.",
                              "Rejected",
                                  "Rejected: " & varActorText & " rejected it: " & Trim(varComment) &
                                  ". The signatures so far no longer stand. Edit it and send it for signing or for review.",
                              ""
                          )
                      );
                      // The author hears about an outcome that lands back with them.
                      If(
                          !IsBlank(varNotifySummary) && !IsBlank(varNotifyUrl) && CountRows(varNotifyPeople) > 0,
                          Set(
                              varNotifyRes,
                              IfError(
                                  'CORMS-NotificationBridge'.Run(
                                      varNotifyUrl,
                                      JSON(
                                          {
                                              event: "ApprovalStepActive",
                                              correspondenceId: varCorrId,
                                              correspondenceNumber: Coalesce(varCorr.ReferenceNo, ""),
                                              subject: Coalesce(varCorr.Title, ""),
                                              url: varSiteUrl & "#/correspondence/" & varCorrId,
                                              actionSummary: varNotifySummary,
                                              teamsTeamId: varTeamsId,
                                              details: nfNotifyDetails,
                                              recipients: varNotifyPeople
                                          },
                                          JSONFormat.IgnoreUnsupportedTypes
                                      )
                                  ),
                                  {sent: "false", status: "0", error: FirstError.Message}
                              )
                          );
                          If(
                              !IsBlank(varNotifyRes.error),
                              Trace("Notification to the author failed", TraceSeverity.Warning, {error: varNotifyRes.error})
                          )
                      );
                      // Once every signer has signed, a correspondence sent by Email goes to its external
                      // organisations with the signed PDF attached (CORMS's DeliveryEmail + ExternalOrganizations;
                      // the addresses are in admin.externalOrganizationsJson). No CORMS link: they can't open it.
                      If(
                          nfCorrStatus = "Signed" && varCorr.DeliveryEmail && !IsBlank(varNotifyUrl),
                          Set(
                              varExtNames,
                              IfError(
                                  ForAll(
                                      Table(ParseJSON(Coalesce(varCorr.ExternalOrganizations, "[]"))) As n,
                                      Lower(Trim(Text(n.Value)))
                                  ),
                                  Blank()
                              )
                          );
                          Set(
                              varExtPeople,
                              IfError(
                                  Filter(
                                      ForAll(
                                          Table(ParseJSON(Coalesce(LookUp(CORMS_AdminConfig, Title = "admin.externalOrganizationsJson").Value, "[]"))) As o,
                                          With(
                                              {
                                                  en: Trim(Coalesce(Text(o.Value.nameEn), Text(o.Value.name))),
                                                  ar: Trim(Text(o.Value.nameAr)),
                                                  mail: Trim(Coalesce(Text(o.Value.email), IfError(Text(First(Table(o.Value.emails)).Value), "")))
                                              },
                                              {
                                                  email: mail,
                                                  name: Coalesce(en, ar),
                                                  role: "External",
                                                  matched: (!IsBlank(en) && Lower(en) in varExtNames.Value) ||
                                                      (!IsBlank(ar) && Lower(ar) in varExtNames.Value)
                                              }
                                          )
                                      ),
                                      matched && !IsBlank(email)
                                  ),
                                  Blank()
                              )
                          );
                          If(
                              CountRows(varExtPeople) > 0,
                              // The signed PDF: the main document now (signing replaced it).
                              Set(varSignedDoc, LookUp(CORMS_Attachments, CorrespondenceId = varCorrId && IsMainLetter = true));
                              Set(
                                  varExtRes,
                                  IfError(
                                      'CORMS-NotificationBridge'.Run(
                                          varNotifyUrl,
                                          JSON(
                                              {
                                                  event: "ExternalDelivery",
                                                  templateEvent: "Signed",
                                                  correspondenceId: varCorrId,
                                                  correspondenceNumber: Coalesce(varCorr.ReferenceNo, ""),
                                                  subject: Coalesce(varCorr.Title, ""),
                                                  url: "",
                                                  actionSummary: "Please find attached the signed correspondence " &
                                                      Coalesce(varCorr.ReferenceNo, "") & ": " & Coalesce(varCorr.Title, "") & ".",
                                                  teamsTeamId: "",
                                                  details: nfNotifyDetails,
                                                  recipients: ShowColumns(varExtPeople, email, name, role)
                                              },
                                              JSONFormat.IgnoreUnsupportedTypes
                                          ),
                                          {
                                              text_2: varSignedDoc.'Full Path',
                                              text_3: varSignedDoc.'File name with extension'
                                          }
                                      ),
                                      {sent: "false", status: "0", error: FirstError.Message, attached: ""}
                                  )
                              );
                              If(
                                  varExtRes.sent = "true" && varExtRes.attached = "true",
                                  Patch(
                                      CORMS_Timeline,
                                      Defaults(CORMS_Timeline),
                                      {
                                          Title: "Email sent",
                                          CorrespondenceId: varCorrId,
                                          Actor: fxMe,
                                          EventTimestamp: DateAdd(Now(), 2, TimeUnit.Seconds),
                                          EventType: {Value: "EmailSent"},
                                          Description: "Signed document emailed to " & Concat(varExtPeople, name, ", ")
                                      }
                                  ),
                                  Trace(
                                      "Signed document could not be emailed to the external organisations",
                                      TraceSeverity.Warning,
                                      {error: varExtRes.error, attached: varExtRes.attached}
                                  )
                              )
                          )
                      );
                      // When the last reviewer approves, the authors also get a "Final confirmation:" task
                      // in My Tasks, the same one CORMS creates (finalConfirmationTask.ts); CORMS completes
                      // it when the author sends the correspondence for signing. Skipped while one is open.
                      If(
                          nfCorrStatus = "Awaiting Final Confirmation" && CountRows(varNotifyPeople) > 0 &&
                          IsBlank(
                              LookUp(
                                  CORMS_Tasks,
                                  RelatedCorrespondenceId = varCorrId &&
                                  StartsWith(Title, "Final confirmation:") &&
                                  (Status.Value = "Pending" || Status.Value = "In Progress" || Status.Value = "Overdue")
                              )
                          ),
                          IfError(
                              Set(
                                  varFinalTask,
                                  Patch(
                                      CORMS_Tasks,
                                      Defaults(CORMS_Tasks),
                                      {
                                          Title: "Final confirmation: " & Coalesce(varCorr.Title, ""),
                                          TaskType: {Value: "To Do"},
                                          Priority: {Value: If(varCorr.Priority = "High", "High", "Normal")},
                                          Status: {Value: "Pending"},
                                          DueDate: varCorr.DueDate,
                                          // The same people the email goes to: Created By and Assigned To, each once.
                                          AssignedToUser: ForAll(
                                              varNotifyPeople As p,
                                              With(
                                                  {
                                                      src: If(
                                                          Lower(Coalesce(varCorr.'Created By'.Email, "")) = p.email,
                                                          varCorr.'Created By',
                                                          varCorr.AssignedTo
                                                      )
                                                  },
                                                  {
                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                      Claims: src.Claims,
                                                      Department: Coalesce(src.Department, ""),
                                                      DisplayName: src.DisplayName,
                                                      Email: src.Email,
                                                      JobTitle: Coalesce(src.JobTitle, ""),
                                                      Picture: ""
                                                  }
                                              )
                                          ),
                                          RelatedCorrespondenceId: varCorrId,
                                          Description: "All reviewers approved. Confirm it’s final and send it to the signers. This task is completed automatically when you send it to the signers."
                                      }
                                  )
                              );
                              // Same reference series as the task app: TSK-<year>-<item ID>.
                              Patch(CORMS_Tasks, varFinalTask, {ReferenceNo: "TSK-" & Text(Year(Today())) & "-" & Text(varFinalTask.ID, "0000")});
                              true,
                              Trace("Final confirmation task could not be created", TraceSeverity.Error, {error: FirstError.Message});
                              Notify("Your decision was saved, but the author's confirmation task couldn't be created.", NotificationType.Warning)
                          )
                      );
                      // An approval that opens the next step tells that step's assignees it is their turn.
                      Set(
                          varNextPeople,
                          If(
                              varOutcome = "Approved" && !IsBlank(nfActiveStep) &&
                              (nfCorrStatus = "In Review" || nfCorrStatus = "Awaiting Signature"),
                              ForAll(
                                  Filter(colSteps, StepOrder = nfActiveStep, Status.Value = "Pending") As t,
                                  {
                                      email: Lower(Last(Split(Coalesce(t.AssignedToId, ""), "|")).Value),
                                      name: Coalesce(t.AssignedToName, ""),
                                      role: "Approver"
                                  }
                              ),
                              Blank()
                          )
                      );
                      If(
                          !IsBlank(varNotifyUrl) && CountRows(Filter(varNextPeople, !IsBlank(email))) > 0,
                          Set(
                              varNotifyRes,
                              IfError(
                                  'CORMS-NotificationBridge'.Run(
                                      varNotifyUrl,
                                      JSON(
                                          {
                                              event: "ApprovalStepActive",
                                              correspondenceId: varCorrId,
                                              correspondenceNumber: Coalesce(varCorr.ReferenceNo, ""),
                                              subject: Coalesce(varCorr.Title, ""),
                                              url: varSiteUrl & "#/correspondence/" & varCorrId,
                                              actionSummary: LookUp(nfChain, stepOrder = nfActiveStep).stepName & ": " &
                                                  Coalesce(
                                                      First(Filter(colSteps, StepOrder = nfActiveStep)).ActionComments,
                                                      "Review and approve this correspondence."
                                                  ),
                                              teamsTeamId: varTeamsId,
                                              details: nfNotifyDetails,
                                              recipients: Filter(varNextPeople, !IsBlank(email))
                                          },
                                          JSONFormat.IgnoreUnsupportedTypes
                                      )
                                  ),
                                  {sent: "false", status: "0", error: FirstError.Message}
                              )
                          );
                          If(
                              !IsBlank(varNotifyRes.error),
                              Trace("Notification to the next step failed", TraceSeverity.Warning, {error: varNotifyRes.error})
                          )
                      );
                      Notify("Your decision was saved.", NotificationType.Success)
                  );
                  Set(varBusy, false)
              );
              // Audit entries go to the CORMS audit index (Elasticsearch) in the document shape CORMS
              // writes (AuditTrailServiceCore.logEvent), so they appear in the correspondence's Audit
              // tab. Each entry keeps the moment it happened; the Audit tab orders by that timestamp.
              If(
                  !IsEmpty(colAuditQueue),
                  If(
                      varAuditOn && !IsBlank(varAuditKey),
                      ForAll(
                          colAuditQueue As a,
                          IfError(
                              'CORMS-AuditBridge'.Run(
                                  varAuditEndpoint,
                                  varAuditKey,
                                  JSON(
                                      {
                                          timestamp: a.ts,
                                          action: a.action,
                                          application: "CORMS",
                                          objectId: a.objectId,
                                          entity_id_record: a.objectId,
                                          entity_id: If(IsNumeric(a.objectId), Value(a.objectId), Blank()),
                                          Details: a.details,
                                          userName: User().FullName,
                                          userEmail: User().Email,
                                          SiteUrl: varSiteUrl,
                                          category: If(StartsWith(a.action, "Correspondence"), "correspondence", "system"),
                                          chainStatus: "valid"
                                      },
                                      JSONFormat.IgnoreUnsupportedTypes
                                  ),
                                  {text_1: varAuditIndex}
                              ),
                              Trace("Audit entry could not be written", TraceSeverity.Warning, {action: a.action});
                              Blank()
                          )
                      )
                  );
                  Clear(colAuditQueue)
              )
            Repeat: =true
            Start: =varPanelTimerOn
            Width: =1
            X: =-200
            Y: =-200
      - ApprovalPanel7:
          Control: CodeComponent
          ComponentName: corms_CORMS.ApprovalPanel
          Properties:
            ActionJson: =varPanelActionIn
            Busy: =varBusy
            CanAct: =nfCanAct
            CorrespondenceUrl: =varSiteUrl & "#/correspondence/" & varCorrId
            DataJson: =nfPanelData
            ErrorMessage: =varPanelError
            Height: =Parent.Height - 24
            ReturnUrl: =varReturnUrl
            SigningUrl: =varSigningUrl
            Width: =Parent.Width - 24
            X: =12
            Y: =12
