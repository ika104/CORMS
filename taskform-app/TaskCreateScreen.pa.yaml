Screens:
  TaskCreateScreen:
    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varRelatedCorrespondenceId, Coalesce(Param("relatedCorrespondenceId"), ""));
        // Correspondence passed in by the host page (ID or reference number), preselected in the dropdown
        Set(
            varPreCorrespondence,
            If(
                IsBlank(varRelatedCorrespondenceId),
                Blank(),
                IsNumeric(varRelatedCorrespondenceId),
                LookUp(CORMS_Correspondence, ID = Value(varRelatedCorrespondenceId)),
                LookUp(CORMS_Correspondence, ReferenceNo = varRelatedCorrespondenceId)
            )
        );
        Set(varTriedSubmit, false);
        Set(varCloseReason, "cancel");
        // Follow-up Tasks go to someone else; To Do and Reminder default to the creator (CMS-050.5)
        Set(varAssignSelf, false);
        Reset(Checkbox1);
        Concurrent(
        Set(VarShowForm,true),
        Set(VarShowRev,false),
        Set(VarShowFilles,false)
        );
        Concurrent(
        Set(VarShowForm1,true),
        Set(VarShowRev1,false),
        Set(VarShowFilles1,false)
        );
    Children:
      - ScreenContainer1_1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
