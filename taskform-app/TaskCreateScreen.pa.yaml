                        FillPortions: =0
                        Height: =130
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =13
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtCreateCommentLabel:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: ="Comment"
                        - inpCreateComment:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Comment"
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(122, 138, 143, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =70
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Placeholder: ="Optional comment, saved to the audit trail"
                              Type: =TextInputType.Multiline
            - FooterContainer1_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - Button2:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Outline
                        Height: =40
                        OnSelect: |-
                          =Reset(SubjectInput);
                          Reset(TextInput1_1);
                          Reset(DatePicker1);
                          Reset(Combobox1);
                          Reset(Combobox1_1);
                          Reset(Combobox1_3);
                          Reset(Checkbox1);
                          Reset(inpCreateComment);
                          ResetForm(frmTaskAttach);
                          Set(varTriedSubmit, false);
                          Set(varAssignSelf, false);
                          Reset(Checkbox1);
                          Concurrent(
                              Set(VarShowForm, true),
                              Set(VarShowRev, false),
                              Set(VarShowFilles, false),
                              Set(VarShowForm1, true),
                              Set(VarShowRev1, false),
                              Set(VarShowFilles1, false)
                          );

                          // Signal the SPFx host: it watches the iframe URL hash (#corms=...) and closes the panel
                          Launch(
                              fxCloseUrl & "#corms=" & Coalesce(varCloseReason, "cancel"),
                              {},
                              LaunchTarget.Replace
                          );
                        Text: ="Cancel"
                        X: =8
                        Y: =22
                  - Button2_1:
                      Control: ModernButton
                      Properties:
                        DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                        FontWeight: =FontWeight.Normal
                        Height: =40
                        IconStyle: =IconStyle.Filled
                        OnSelect: |-
                          =With(
                              {
                                locMissing: Filter(
                                  Table(
                                    { Field: "Subject", IsMissing: IsBlank(Trim(SubjectInput.Text)) },
                                    //{ Field: "Assignee Team", IsMissing: !Checkbox1.Checked && IsBlank(Combobox1.Selected) },
                                    { Field: "Team Member", IsMissing: !Checkbox1.Checked && IsEmpty(Combobox1_1.SelectedItems) },
                                    { Field: "Due Date", IsMissing: IsBlank(DatePicker1.SelectedDate) }
                                  ),
                                  IsMissing
                                )
                              },
                              If(
                                !IsEmpty(locMissing),
                                Set(varTriedSubmit, true);
                                Notify("Please fill in " & Concat(locMissing, Field, ", "), NotificationType.Error),

                                Set(varIsLoading, true);
                                IfError(
                                  // 1. Create the task
                                  Set(
                                    varNewTask,
                                    Patch(
                                      CORMS_Tasks,
                                      Defaults(CORMS_Tasks),
                                      {
                                        Title: Trim(SubjectInput.Text),
                                        TaskType: { Value: If(VarShowForm, Button4.Text, If(VarShowRev, Button4_1.Text, Button4_3.Text)) },
                                        Priority: { Value: Trim(If(VarShowForm1, Button4_2.Text, If(VarShowRev1, Button4_4.Text, Button4_5.Text))) },
                                        Status: { Value: "Pending" },
                                        DueDate: DatePicker1.SelectedDate,
                                        Description: TextInput1_1.Text,
                                        AssignedToTeam: If(
                                          Checkbox1.Checked,
                                          Coalesce(LookUp(CORMS_UserRoles, User.Email = User().Email).Department, ""),
                                          Combobox1.Selected.Value
                                        ),
                                        AssignedToUser: If(
                                          Checkbox1.Checked,
                                          Table(fxMe),
                                          ForAll(
                                            Combobox1_1.SelectedItems,
                                            {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(ThisRecord.UserPrincipalName),
                                              Department: Coalesce(ThisRecord.Department, ""),
                                              DisplayName: ThisRecord.DisplayName,
                                              Email: ThisRecord.Mail,
                                              JobTitle: Coalesce(ThisRecord.JobTitle, ""),
                                              Picture: ""
                                            }
                                          )
                                        ),
                                        RelatedCorrespondenceId: If(IsBlank(Combobox1_3.Selected), "", Text(Combobox1_3.Selected.ID))
                                      }
                                    )
                                  );
                                  // 2. Reference number from the SharePoint ID, so it can never repeat
                                  Set(varNewRefNo, "TSK-" & Text(Year(Today())) & "-" & Text(varNewTask.ID, "0000"));
                                  Patch(CORMS_Tasks, varNewTask, { ReferenceNo: varNewRefNo });
                                  // 3. Upload each file to the CORMS_Attachments library, linked by TaskReferenceNo
                                  //    (the flow rejects a blank CorrespondenceId, so it is only sent when there is one)
                                  IfError(
                                    ForAll(
                                      AttachControl_4.Attachments,
                                      If(
                                        IsBlank(varNewTask.RelatedCorrespondenceId),
                                        'CORMS-UploadTaskAttachment'.Run(
                                          { contentBytes: ThisRecord.Value, name: ThisRecord.Name },
                                          varNewRefNo
                                        ),
                                        'CORMS-UploadTaskAttachment'.Run(
                                          { contentBytes: ThisRecord.Value, name: ThisRecord.Name },
                                          varNewRefNo,
                                          { text_1: varNewTask.RelatedCorrespondenceId }
                                        )
                                      )
                                    ),
                                    Notify("Task " & varNewRefNo & " was created, but a file could not be uploaded. " & FirstError.Message, NotificationType.Warning)
                                  );
                                  // 4. Audit + timeline entries
                                  Patch(
                                    CORMS_AuditLog,
                                    Defaults(CORMS_AuditLog),
                                    {
                                      Title: varNewRefNo,
                                      ObjectId: varNewRefNo,
                                      Action: "Task Created",
                                      Actor: fxMe,
                                      Details: "Created " & varNewTask.TaskType.Value & " """ & varNewTask.Title & """ assigned to " & Concat(varNewTask.AssignedToUser, DisplayName, ", ") &
                                        If(IsEmpty(AttachControl_4.Attachments), "", " with " & CountRows(AttachControl_4.Attachments) & " file(s)")
                                    }
                                  );
                                  // CMS-050.10: the comment is mirrored to the audit trail
                                  If(
                                    !IsBlank(Trim(inpCreateComment.Text)),
                                    Patch(
                                      CORMS_AuditLog,
                                      Defaults(CORMS_AuditLog),
                                      {
                                        Title: varNewRefNo,
                                        ObjectId: varNewRefNo,
                                        Action: "Comment Added",
                                        Actor: fxMe,
                                        Details: Trim(inpCreateComment.Text)
                                      }
                                    )
                                  );
                                  Patch(
                                    CORMS_Timeline,
                                    Defaults(CORMS_Timeline),
                                    {
                                      Title: "Task created",
                                      CorrespondenceId: varNewRefNo,
                                      Actor: fxMe,
                                      EventTimestamp: Today(),
                                      Description: "Created as " & varNewTask.TaskType.Value & " - " & varNewTask.Title
                                    }
                                  );
                                  Patch(
                                    CORMS_Timeline,
                                    Defaults(CORMS_Timeline),
                                    {
                                      Title: "Assigned",
                                      CorrespondenceId: varNewRefNo,
                                      Actor: fxMe,
                                      EventTimestamp: Today(),
                                      Description: "Assigned to " & Concat(varNewTask.AssignedToUser, DisplayName, ", ") &
                                        If(IsBlank(varNewTask.AssignedToTeam), "", " (" & varNewTask.AssignedToTeam & ")")
                                    }
                                  );
                                  If(
                                    !IsBlank(Combobox1_3.Selected),
                                    Patch(
                                      CORMS_Timeline,
                                      Defaults(CORMS_Timeline),
                                      {
                                        Title: "Linked",
                                        CorrespondenceId: varNewRefNo,
                                        Actor: fxMe,
                                        EventTimestamp: Today(),
                                        Description: "Linked to correspondence " & Combobox1_3.Selected.ReferenceNo
                                      }
                                    )
                                  );
                                  Set(varStatusText, "Task " & varNewRefNo & " created.");
                                  If(
                                    !IsEmpty(AttachControl_4.Attachments),
                                    Patch(
                                      CORMS_AuditLog,
                                      Defaults(CORMS_AuditLog),
                                      {
                                        Title: varNewRefNo,
                                        ObjectId: varNewRefNo,
                                        Action: "Files Attached",
                                        Actor: fxMe,
                                        Details: CountRows(AttachControl_4.Attachments) & " file(s) uploaded: " & Concat(AttachControl_4.Attachments, Name, ", ")
                                      }
                                    );
                                    Patch(
                                      CORMS_Timeline,
                                      Defaults(CORMS_Timeline),
                                      {
                                        Title: "Files attached",
                                        CorrespondenceId: varNewRefNo,
                                        Actor: fxMe,
                                        EventTimestamp: Today(),
                                        Description: Concat(AttachControl_4.Attachments, Name, ", ")
                                      }
                                    )
                                  );
                                  Notify("Task " & varNewRefNo & " created successfully.", NotificationType.Success);
                                  Set(varCloseReason, "created;ref=" & varNewRefNo);
                                  Select(Button2),

                                  Notify("Could not create the task. " & FirstError.Message, NotificationType.Error)
                                );
                                Set(varIsLoading, false)
                              )
                          )
                        Size: =14
                        Text: ="Create Task"
                        Width: =100
                        X: =8
                        Y: =22
