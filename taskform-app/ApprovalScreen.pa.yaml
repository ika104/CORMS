Screens:
  ApprovalScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |-
        =Set(
            varTaskId,
            Value(
                Coalesce(
                    Param("taskId"),
                    "0"
                )
            )
        );
        Set(
            varCurrentTask1,
            LookUp(
                CORMS_Tasks,
                ID = varTaskId
            )
        )
    Children:
      - HeaderRect_1:
          Control: Rectangle
          Properties:
            Fill: =RGBA(15, 108, 189, 1)
            Height: =64
            OnSelect: '=false   '
            Width: =App.Width
      - AppTitleLabel_1:
          Control: Label
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =16
            Text: ="Document Approval"
            Width: =260
            X: =16
            Y: =16
      - RefNoBadge_1:
          Control: Label
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            Height: =24
            Size: =12
            Text: =varCurrentTask1.ReferenceNo
            Width: =184
            X: =App.Width - 200
            Y: =20
      - DetailCard_1:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =210
            Width: =Min(App.Width - 32, 600)
            X: =Max(16, (App.Width - 600) / 2)
            Y: =80
      - SubjectLabel_1:
          Control: Label
          Properties:
            AutoHeight: =true
            Color: =RGBA(29, 29, 29, 1)
            FontWeight: =FontWeight.Bold
            Height: =44
            Overflow: =Overflow.Scroll
            Text: =varCurrentTask1.Title
            Width: =Min(App.Width - 32, 600) - 32
            X: =Max(16, (App.Width - 600) / 2) + 16
            Y: =96
      - TypeLabel_1:
          Control: Label
          Properties:
            Color: =RGBA(96, 96, 96, 1)
            Height: =24
            Text: |-
              ="Type: " & varCurrentTask1.TaskType.Value
            Width: =220
            X: =Max(16, (App.Width - 600) / 2) + 16
            Y: =148
      - PriorityChip_1:
          Control: Label
          Properties:
            Align: =Align.Center
            BorderColor: =App.Theme.Colors.Darker30
            Color: =RGBA(255, 255, 255, 1)
            Fill: |-
              =Switch(
                  varCurrentTask1.Priority.Value,
                  "High",RGBA(220,38,38,1),
                  "Normal",RGBA(37,99,235,1),
                  "Low",RGBA(22,128,61,1),
                  RGBA(75,85,99,1))
            Height: =30
            Size: =10
            Text: =varCurrentTask1.Priority.Value
            Width: =120
            X: =Max(16, (App.Width - 600) / 2) + 16
            Y: =180
      - SecurityTierLabel_1:
          Control: Label
          Properties:
            Color: =RGBA(96, 96, 96, 1)
            Height: =24
            Text: |-
              ="Security: " & Param("securityTier")
            Width: =220
            X: =Max(16, (App.Width - 600) / 2) + 16
            Y: =212
      - OriginatorLabel_1:
          Control: Label
          Properties:
            Color: =RGBA(96, 96, 96, 1)
            Height: =24
            Text: |-
              ="From: " & Param("originatorEmail")
            Width: =Min(App.Width - 32, 600) - 32
            X: =Max(16, (App.Width - 600) / 2) + 16
            Y: =244
      - DocumentButton_1:
          Control: ModernButton
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =40
            Icon: ="Open"
            Layout: =ButtonLayout.IconAfter
            OnSelect: =Launch(Param("documentUrl"))
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: ="Open Document"
            VerticalAlign: =VerticalAlign.Middle
            Width: =Min(App.Width - 32, 600)
            X: =Max(16, (App.Width - 600) / 2)
            Y: =308
      - CommentLabel_1:
          Control: Label
          Properties:
            Color: =RGBA(29, 29, 29, 1)
            Height: =24
            Text: ="Comment (optional)"
            Width: =200
            X: =Max(16, (App.Width - 600) / 2)
            Y: =364
      - CommentInput_1:
          Control: ModernTextInput
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            FontWeight: =""
            Height: =112
            MaxLength: =-1
            Placeholder: ="Add a comment..."
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =0
            TriggerOutput: =TriggerOutput.FocusOut
            Width: =Min(App.Width - 32, 600)
            X: =Max(16, (App.Width - 600) / 2)
            Y: =392
      - ApproveButton_1:
          Control: ModernButton
          Properties:
            Align: =Align.Center
            BasePaletteColor: =RGBA(8, 222, 8, 1)
            DisplayMode: =If(Or(varIsLoading, IsBlank(varCurrentTask1)), DisplayMode.Disabled, DisplayMode.Edit)
            FontWeight: =""
            Height: =40
            OnSelect: |-
              =Set(varIsLoading, true);
              Set(varStatusText, "");
              IfError(
                Patch(
                  CORMS_Tasks,
                  varCurrentTask1,
                  {
                    Status:{Value:"Completed"}
                  }
                );
                Patch(
                  CORMS_AuditLog,
                  Defaults(CORMS_AuditLog),
                  { Title: varCurrentTask1.ReferenceNo, ObjectId: varCurrentTask1.ReferenceNo, Action: "Approved", Actor: fxMe, Details: CommentInput_1.Text }
                );
                Patch(
                  CORMS_Timeline,
                  Defaults(CORMS_Timeline),
                  { Title: "Approved", CorrespondenceId: varCurrentTask1.ReferenceNo, Actor: fxMe, EventTimestamp: Today(), Description: CommentInput_1.Text }
                );
                Set(varStatusText, "Approved successfully."),
                Set(varStatusText, "Error: " & FirstError.Message)
              );
              Set(varIsLoading, false)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: ="Approve"
            VerticalAlign: =VerticalAlign.Middle
            Width: |-
              =With(
                {locWidth: Min(App.Width - 32, 600)},
                If(App.Width < 500, locWidth, (locWidth - 16) / 3)
              )
            X: =Max(16, (App.Width - 600) / 2)
            Y: =520
      - RejectButton_1:
          Control: ModernButton
          Properties:
            Align: =Align.Center
            BasePaletteColor: =RGBA(249, 83, 109, 1)
            DisplayMode: =If(Or(varIsLoading, IsBlank(varCurrentTask1)), DisplayMode.Disabled, DisplayMode.Edit)
            FontWeight: =""
            Height: =40
            OnSelect: |-
              =Set(varIsLoading, true);
              Set(varStatusText, "");
              IfError(
                Patch(
                  CORMS_Tasks,
                  varCurrentTask1,
                  {
                    // Use a "Rejected" status when the Status column offers one; otherwise send it back to Pending
                    Status: If(
                      IsBlank(LookUp(Choices(CORMS_Tasks.Status), Value = "Rejected")),
                      {Value:"Pending"},
                      {Value:"Rejected"}
                    )
                  }
                );
                Patch(
                  CORMS_AuditLog,
                  Defaults(CORMS_AuditLog),
                  { Title: varCurrentTask1.ReferenceNo, ObjectId: varCurrentTask1.ReferenceNo, Action: "Rejected", Actor: fxMe, Details: CommentInput_1.Text }
                );
                Patch(
                  CORMS_Timeline,
                  Defaults(CORMS_Timeline),
                  { Title: "Rejected", CorrespondenceId: varCurrentTask1.ReferenceNo, Actor: fxMe, EventTimestamp: Today(), Description: CommentInput_1.Text }
                );
                Set(varStatusText, "Rejected."),
                Set(varStatusText, "Error: " & FirstError.Message)
              );
              Set(varIsLoading, false)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: ="Reject"
            VerticalAlign: =VerticalAlign.Middle
            Width: |-
              =With(
                {locWidth: Min(App.Width - 32, 600)},
                If(App.Width < 500, locWidth, (locWidth - 16) / 3)
              )
            X: |-
              =With(
                {locLeft: Max(16, (App.Width - 600) / 2), locWidth: Min(App.Width - 32, 600)},
                If(App.Width < 500, locLeft, locLeft + (locWidth - 16) / 3 + 8)
              )
            Y: =If(App.Width < 500, 568, 520)
      - RequestChangesButton_1:
          Control: ModernButton
          Properties:
            Align: =Align.Center
            BasePaletteColor: =RGBA(189, 178, 176, 1)
            DisplayMode: =If(Or(varIsLoading, IsBlank(varCurrentTask1)), DisplayMode.Disabled, DisplayMode.Edit)
            FontWeight: =""
            Height: =40
            OnSelect: |-
              =Set(varIsLoading, true);
              Set(varStatusText, "");
              IfError(
                Patch(
                  CORMS_Tasks,
                  varCurrentTask1,
                  {
                    Status:{Value:"In Progress"}
                  }
                );
                Patch(
                  CORMS_AuditLog,
                  Defaults(CORMS_AuditLog),
                  { Title: varCurrentTask1.ReferenceNo, ObjectId: varCurrentTask1.ReferenceNo, Action: "Changes Requested", Actor: fxMe, Details: CommentInput_1.Text }
                );
                Patch(
                  CORMS_Timeline,
                  Defaults(CORMS_Timeline),
                  { Title: "Changes requested", CorrespondenceId: varCurrentTask1.ReferenceNo, Actor: fxMe, EventTimestamp: Today(), Description: CommentInput_1.Text }
                );
                Set(varStatusText, "Changes requested."),
                Set(varStatusText, "Error: " & FirstError.Message)
              );
              Set(varIsLoading, false)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Text: ="Request Changes"
            VerticalAlign: =VerticalAlign.Middle
            Width: |-
              =With(
                {locWidth: Min(App.Width - 32, 600)},
                If(App.Width < 500, locWidth, (locWidth - 16) / 3)
              )
            X: |-
              =With(
                {locLeft: Max(16, (App.Width - 600) / 2), locWidth: Min(App.Width - 32, 600)},
                If(App.Width < 500, locLeft, locLeft + 2 * ((locWidth - 16) / 3 + 8))
              )
            Y: =If(App.Width < 500, 616, 520)
      - StatusLabel_1:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =If(StartsWith(varStatusText, "Error"), RGBA(220,38,38,1), RGBA(22,163,74,1))
            Height: =32
            Text: =varStatusText
            Visible: =Not(IsBlank(varStatusText))
            Width: =Min(App.Width - 32, 600)
            X: =Max(16, (App.Width - 600) / 2)
            Y: =If(App.Width < 500, 664, 576)
