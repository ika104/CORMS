Screens:
  TaskDetailScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varTab, "Details");
        ClearCollect(colStatusChoices, Choices(CORMS_Tasks.Status));
        Reset(tabDet);
        Set(varEditField, "");
        Reset(inpFltDetField); Reset(inpFltDetValue); Reset(inpFltFilesName); Reset(inpFltFilesDate); Reset(inpFltFilesSource); Reset(inpFltSecPrincipal); Reset(inpFltSecLevel); Reset(inpFltSecType); Reset(inpFltAuditNo); Reset(inpFltAuditAction); Reset(inpFltAuditActor); Reset(inpFltAuditDetails); Reset(inpFltAuditTime); UpdateContext({locFltDetField: "", locFltDetValue: "", locFltFilesName: "", locFltFilesDate: "", locFltFilesSource: "", locFltSecPrincipal: "", locFltSecLevel: "", locFltSecType: "", locFltAuditNo: "", locFltAuditAction: "", locFltAuditActor: "", locFltAuditDetails: "", locFltAuditTime: ""});
        UpdateContext({locFltRowDetails: false, locFltRowFiles: false, locFltRowSecurity: false, locFltRowAudit: false});
        UpdateContext(
            {
                locDirty: false,
                locSubject: "", locSubjectSet: false,
                locDescription: "", locDescSet: false,
                locTeam: "", locTeamSet: false,
                locDue: Blank(), locDueSet: false,
                locCorr: Blank(), locCorrSet: false,
                locType: Blank(), locStatus: Blank(), locPriority: Blank(), locMember: Blank(), locMemberSet: false
            }
        );
        Set(
            varTaskId,
            Value(Coalesce(Param("taskId"), "0"))
        );
        Set(varCurrentTask, LookUp(CORMS_Tasks, ID = varTaskId));
        Set(
            varIsOverdue,
            !IsBlank(varCurrentTask.DueDate) && varCurrentTask.DueDate < Today() &&
            !(varCurrentTask.Status.Value in ["Completed", "Rejected"])
        );
        // Related correspondence (stored as its ID; older tasks may hold the reference number)
        Set(
            varRelCorr,
            If(
                IsBlank(varCurrentTask.RelatedCorrespondenceId),
                Blank(),
                IsNumeric(varCurrentTask.RelatedCorrespondenceId),
                LookUp(CORMS_Correspondence, ID = Value(varCurrentTask.RelatedCorrespondenceId)),
                LookUp(CORMS_Correspondence, ReferenceNo = varCurrentTask.RelatedCorrespondenceId)
            )
        );
        // Files = documents uploaded for this task (CORMS_Attachments.TaskReferenceNo)
        //         + documents of its related correspondence (CORMS_Attachments.CorrespondenceId)
        ClearCollect(
            colTaskFiles,
            ForAll(
                Filter(CORMS_Attachments, TaskReferenceNo = varCurrentTask.ReferenceNo),
                {
                    DocId: ThisRecord.ID,
                    FileName: Coalesce(ThisRecord.FileName, ThisRecord.Name),
                    Uploaded: ThisRecord.Created,
                    Url: fxSiteUrl & "/_layouts/download.aspx?SourceUrl=" & fxSiteUrl & "/" & ThisRecord.'Full Path',
                    Source: "Task",
                    Link: ThisRecord.'Link to item',
                    IsMain: false
                }
            )
        );
        If(
            !IsBlank(varRelCorr),
            Collect(
                colTaskFiles,
                ForAll(
                    Filter(
                        CORMS_Attachments,
                        CorrespondenceId = Text(varRelCorr.ID) || CorrespondenceId = varRelCorr.ReferenceNo
                    ),
                    {
                        DocId: ThisRecord.ID,
                        FileName: Coalesce(ThisRecord.FileName, ThisRecord.Name),
                        Uploaded: ThisRecord.Created,
                        Url: fxSiteUrl & "/_layouts/download.aspx?SourceUrl=" & fxSiteUrl & "/" & ThisRecord.'Full Path',
                        Source: "Correspondence",
                        Link: ThisRecord.'Link to item',
                        IsMain: ThisRecord.IsMainLetter
                    }
                )
            )
        );
        // A task file linked to the same correspondence would otherwise be listed twice
        RemoveIf(
            colTaskFiles,
            Source = "Correspondence" && DocId in Filter(colTaskFiles, Source = "Task").DocId
        );
        // Document shown on the Document & Approval tab: the correspondence main letter, else the first file
        Set(
            varMainDoc,
            If(
                IsBlank(LookUp(colTaskFiles, IsMain)),
                First(colTaskFiles),
                LookUp(colTaskFiles, IsMain)
            )
        );
        ClearCollect(
            colDetRows,
            ForAll(
                Table(
                    {Idx: 1, Key: "ref", Label: "Reference No.", Editable: false},
                    {Idx: 2, Key: "subject", Label: "Subject", Editable: true},
                    {Idx: 3, Key: "type", Label: "Type", Editable: true},
                    {Idx: 4, Key: "status", Label: "Status", Editable: true},
                    {Idx: 5, Key: "priority", Label: "Priority", Editable: true},
                    {Idx: 6, Key: "team", Label: "Assignee Team", Editable: true},
                    {Idx: 7, Key: "member", Label: "Team Member", Editable: true},
                    {Idx: 8, Key: "createdby", Label: "Created By", Editable: false},
                    {Idx: 9, Key: "created", Label: "Date Created", Editable: false},
                    {Idx: 10, Key: "modified", Label: "Last Updated", Editable: false},
                    {Idx: 11, Key: "due", Label: "Due Date", Editable: true},
                    {Idx: 12, Key: "corr", Label: "Related Correspondence", Editable: true},
                    {Idx: 13, Key: "attach", Label: "Attachment", Editable: false},
                    {Idx: 14, Key: "description", Label: "Description", Editable: true}
                ),
                Patch(
                    ThisRecord,
                    {
                        Val: Switch(
                            ThisRecord.Key,
                            "ref", varCurrentTask.ReferenceNo,
                            "subject", varCurrentTask.Title,
                            "type", varCurrentTask.TaskType.Value,
                            "status", varCurrentTask.Status.Value,
                            "priority", varCurrentTask.Priority.Value,
                            "team", varCurrentTask.AssignedToTeam,
                            "member", Concat(varCurrentTask.AssignedToUser, DisplayName, ", "),
                            "createdby", varCurrentTask.'Created By'.DisplayName,
                            "created", Text(varCurrentTask.Created, "yyyy-mm-dd hh:mm"),
                            "modified", Text(varCurrentTask.Modified, "yyyy-mm-dd hh:mm"),
                            "due", Text(varCurrentTask.DueDate, "yyyy-mm-dd") & If(varIsOverdue, " Overdue", ""),
                            "corr", varRelCorr.ReferenceNo & " " & varRelCorr.Title,
                            "attach", Concat(colTaskFiles, FileName, " "),
                            "description", varCurrentTask.Description,
                            ""
                        )
                    }
                )
            )
        );
        ClearCollect(
            colTaskAudit,
            ForAll(
                Sort(
                    Filter(CORMS_AuditLog, ObjectId = varCurrentTask.ReferenceNo || ObjectId = Text(varCurrentTask.ID)),
                    Created,
                    SortOrder.Descending
                ),
                {
                    ID: ThisRecord.ID,
                    Action: ThisRecord.Action,
                    ActorName: ThisRecord.Actor.DisplayName,
                    Details: ThisRecord.Details,
                    Created: ThisRecord.Created
                }
            )
        );
        ClearCollect(
            colTaskEvents,
            ForAll(
                Sort(
                    Filter(
                        CORMS_Timeline,
                        CorrespondenceId = varCurrentTask.ReferenceNo ||
                        (!IsBlank(varCurrentTask.RelatedCorrespondenceId) && CorrespondenceId = varCurrentTask.RelatedCorrespondenceId)
                    ),
                    Created,
                    SortOrder.Ascending
                ),
                {
                    Title: ThisRecord.Title,
                    EventType: ThisRecord.EventType.Value,
                    Description: ThisRecord.Description,
                    Created: ThisRecord.Created,
                    ActorName: ThisRecord.Actor.DisplayName,
                    IsTaskNote: ThisRecord.Title = "Note" && ThisRecord.CorrespondenceId = varCurrentTask.ReferenceNo
                }
            )
        );
        // Security tab = the SharePoint permissions on the CORMS_Tasks list itself, which apply to every task.
        // Reading them live from SharePoint needs a premium connector, so they are listed here.
        // Update this table if the site groups or their permission levels change.
        ClearCollect(
            colTaskRoles,
            Table(
                { Principal: "CORMS Owners", Level: "Full Control", TypeText: "SharePoint Group" },
                { Principal: "CORMS Visitors", Level: "Read", TypeText: "SharePoint Group" },
                { Principal: "CORMS Members", Level: "Edit", TypeText: "SharePoint Group" }
            )
        )
    Children:
      - conDetRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conDetTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 108, 191, 1)
                  FillPortions: =0
                  Height: =50
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  PaddingLeft: =16
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtDetTopRef:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMinWidth: =120
                        Size: =14
                        Text: =varCurrentTask.ReferenceNo
                        Width: =200
                  - txtDetTopSubject:
                      Control: ModernText
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 0.9)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        LayoutMinWidth: =0
                        Size: =13
                        Text: =varCurrentTask.Title
                        Wrap: =false
            - tabDet:
                Control: ModernTabList
                Properties:
                  AccessibleLabel: ="Task sections"
                  AlignInContainer: =AlignInContainer.Stretch
                  BasePaletteColor: =RGBA(15, 108, 189, 1)
                  Default: |-
                    ={Value: "Details"}
                  Font: =Font.'Segoe UI'
                  Height: =46
                  Items: |-
                    =Table(
                        {Value: "Details"},
                        //{Value: "Document & Approval"},
                        {Value: "Files"},
                        {Value: "Notes"},
                        {Value: "Security"},
                        {Value: "Audit"},
                        {Value: "Timeline"}
                    )
                  LayoutMinHeight: =46
                  LayoutMinWidth: =0
                  OnChange: =Set(varTab, Self.Selected.Value)
                  PaddingLeft: =8
                  TabSize: =TabSize.Medium
            - recDetTabLine:
                Control: Rectangle
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(229, 231, 235, 1)
                  Height: =1
                  LayoutMinHeight: =1
            - conDetDetails:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =varTab = "Details"
                Children:
                  - conDetDetailsHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =24
                        PaddingRight: =24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtDetDetailsTitle:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(36, 36, 36, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinWidth: =0
                              Size: =17
                              Text: ="Details"
                        - btnFltClearDetails:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =34
                              Icon: ="FilterDismiss"
                              OnSelect: |-
                                =Reset(inpFltDetField); Reset(inpFltDetValue); UpdateContext({locFltDetField: "", locFltDetValue: ""})
                              Text: ="Clear filters"
                              Visible: =!IsBlank(locFltDetField) || !IsBlank(locFltDetValue)
                              Width: =140
                        - txtDetOverdue:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(238, 172, 178, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(196, 43, 28, 1)
                              Fill: =RGBA(253, 231, 233, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =14
                              Text: ="⚠ Overdue"
                              Visible: =varIsOverdue
                              Width: =120
                        - btnDetCancelEdit:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =34
                              OnSelect: |-
                                =Set(varEditField, "");
                                UpdateContext(
                                    {
                                        locDirty: false,
                                        locSubject: "", locSubjectSet: false,
                                        locDescription: "", locDescSet: false,
                                        locTeam: "", locTeamSet: false,
                                        locDue: Blank(), locDueSet: false,
                                        locCorr: Blank(), locCorrSet: false,
                                        locType: Blank(), locStatus: Blank(), locPriority: Blank(), locMember: Blank(), locMemberSet: false
                                    }
                                )
                              Text: ="Cancel"
                              Visible: =locDirty || !IsBlank(varEditField)
                              Width: =90
                        - btnDetSave:
                            Control: ModernButton
                            Properties:
                              BasePaletteColor: =RGBA(15, 108, 189, 1)
                              DisplayMode: =If(locDirty && !varIsLoading, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =34
                              Icon: ="Save"
                              OnSelect: |-
                                =Set(varIsLoading, true);
                                With(
                                  {
                                    locOldStatus: varCurrentTask.Status.Value,
                                    locNewStatus: Coalesce(locStatus.Value, varCurrentTask.Status.Value),
                                    locOldMember: Concat(varCurrentTask.AssignedToUser, DisplayName, ", "),
                                    locChanges: Concat(
                                      Filter(
                                        Table(
                                          { F: "Subject", C: locSubjectSet },
                                          { F: "Type", C: !IsBlank(locType) },
                                          { F: "Priority", C: !IsBlank(locPriority) },
                                          { F: "Assignee Team", C: locTeamSet },
                                          { F: "Team Member", C: locMemberSet },
                                          { F: "Due Date", C: locDueSet },
                                          { F: "Related Correspondence", C: locCorrSet },
                                          { F: "Description", C: locDescSet }
                                        ),
                                        C
                                      ),
                                      F,
                                      ", "
                                    )
                                  },
                                  IfError(
                                    Patch(
                                      CORMS_Tasks,
                                      varCurrentTask,
                                      {
                                        Title: If(locSubjectSet, Trim(locSubject), varCurrentTask.Title),
                                        TaskType: If(IsBlank(locType), varCurrentTask.TaskType, locType),
                                        Status: { Value: locNewStatus },
                                        Priority: If(IsBlank(locPriority), varCurrentTask.Priority, locPriority),
                                        AssignedToTeam: If(locTeamSet, locTeam, varCurrentTask.AssignedToTeam),
                                        DueDate: If(locDueSet, locDue, varCurrentTask.DueDate),
                                        RelatedCorrespondenceId: If(
                                          locCorrSet,
                                          If(IsBlank(locCorr), "", Text(locCorr.ID)),
                                          varCurrentTask.RelatedCorrespondenceId
                                        ),
                                        Description: If(locDescSet, locDescription, varCurrentTask.Description)
                                      }
                                    );
                                    // Assignees picked from the directory -> SharePoint person values
                                    If(
                                      locMemberSet,
                                      Patch(
                                        CORMS_Tasks,
                                        LookUp(CORMS_Tasks, ID = varTaskId),
                                        {
                                          AssignedToUser: ForAll(
                                            locMember,
                                            {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(ThisRecord.UserPrincipalName),
                                              Department: Coalesce(ThisRecord.Department, ""),
                                              DisplayName: ThisRecord.DisplayName,
                                              Email: ThisRecord.Mail,
                                              JobTitle: Coalesce(ThisRecord.JobTitle, ""),
                                              Picture: ""
                                            }
                                          )
                                        }
                                      )
                                    );
                                    Patch(
                                      CORMS_AuditLog,
                                      Defaults(CORMS_AuditLog),
                                      {
                                        Title: varCurrentTask.ReferenceNo,
                                        ObjectId: varCurrentTask.ReferenceNo,
                                        Action: If(locOldStatus = locNewStatus, "Task Updated", "Status Changed"),
                                        Actor: fxMe,
                                        Details: If(
                                          locOldStatus = locNewStatus,
                                          "Updated: " & locChanges,
                                          "Status changed from " & locOldStatus & " to " & locNewStatus &
                                          If(IsBlank(locChanges), "", ". Updated: " & locChanges)
                                        )
                                      }
                                    );
                                    // CMS-052.4: every edit shows on the timeline too
                                    If(
                                      !IsBlank(locChanges),
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Task updated",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Today(),
                                          Description: "Changed: " & locChanges
                                        }
                                      )
                                    );
                                    If(
                                      locOldStatus <> locNewStatus,
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Status changed to " & locNewStatus,
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Today(),
                                          Description: "Previous status " & locOldStatus
                                        }
                                      )
                                    );
                                    If(
                                      locMemberSet && Concat(locMember, DisplayName, ", ") <> locOldMember,
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Assigned",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Today(),
                                          Description: "Assigned to " & Concat(locMember, DisplayName, ", ")
                                        }
                                      )
                                    );
                                    If(
                                      locCorrSet && !IsBlank(locCorr),
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Linked",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Today(),
                                          Description: "Linked to correspondence " & locCorr.ReferenceNo
                                        }
                                      )
                                    );
                                    Notify("Changes saved.", NotificationType.Success),

                                    Notify("Could not save the changes. " & FirstError.Message, NotificationType.Error)
                                  )
                                );
                                Set(varCurrentTask, LookUp(CORMS_Tasks, ID = varTaskId));
                                Set(
                                  varIsOverdue,
                                  !IsBlank(varCurrentTask.DueDate) && varCurrentTask.DueDate < Today() &&
                                  !(varCurrentTask.Status.Value in ["Completed", "Rejected"])
                                );
                                Set(
                                  varRelCorr,
                                  If(
                                    IsBlank(varCurrentTask.RelatedCorrespondenceId),
                                    Blank(),
                                    IsNumeric(varCurrentTask.RelatedCorrespondenceId),
                                    LookUp(CORMS_Correspondence, ID = Value(varCurrentTask.RelatedCorrespondenceId)),
                                    LookUp(CORMS_Correspondence, ReferenceNo = varCurrentTask.RelatedCorrespondenceId)
                                  )
                                );
                                ClearCollect(
                                    colDetRows,
                                    ForAll(
                                        Table(
                                            {Idx: 1, Key: "ref", Label: "Reference No.", Editable: false},
                                            {Idx: 2, Key: "subject", Label: "Subject", Editable: true},
                                            {Idx: 3, Key: "type", Label: "Type", Editable: true},
                                            {Idx: 4, Key: "status", Label: "Status", Editable: true},
                                            {Idx: 5, Key: "priority", Label: "Priority", Editable: true},
                                            {Idx: 6, Key: "team", Label: "Assignee Team", Editable: true},
                                            {Idx: 7, Key: "member", Label: "Team Member", Editable: true},
                                            {Idx: 8, Key: "createdby", Label: "Created By", Editable: false},
                                            {Idx: 9, Key: "created", Label: "Date Created", Editable: false},
                                            {Idx: 10, Key: "modified", Label: "Last Updated", Editable: false},
                                            {Idx: 11, Key: "due", Label: "Due Date", Editable: true},
                                            {Idx: 12, Key: "corr", Label: "Related Correspondence", Editable: true},
                                            {Idx: 13, Key: "attach", Label: "Attachment", Editable: false},
                                            {Idx: 14, Key: "description", Label: "Description", Editable: true}
                                        ),
                                        Patch(
                                            ThisRecord,
                                            {
                                                Val: Switch(
                                                    ThisRecord.Key,
                                                    "ref", varCurrentTask.ReferenceNo,
                                                    "subject", varCurrentTask.Title,
                                                    "type", varCurrentTask.TaskType.Value,
                                                    "status", varCurrentTask.Status.Value,
                                                    "priority", varCurrentTask.Priority.Value,
                                                    "team", varCurrentTask.AssignedToTeam,
                                                    "member", Concat(varCurrentTask.AssignedToUser, DisplayName, ", "),
                                                    "createdby", varCurrentTask.'Created By'.DisplayName,
                                                    "created", Text(varCurrentTask.Created, "yyyy-mm-dd hh:mm"),
                                                    "modified", Text(varCurrentTask.Modified, "yyyy-mm-dd hh:mm"),
                                                    "due", Text(varCurrentTask.DueDate, "yyyy-mm-dd") & If(varIsOverdue, " Overdue", ""),
                                                    "corr", varRelCorr.ReferenceNo & " " & varRelCorr.Title,
                                                    "attach", Concat(colTaskFiles, FileName, " "),
                                                    "description", varCurrentTask.Description,
                                                    ""
                                                )
                                            }
                                        )
                                    )
                                );
                                ClearCollect(
                                    colTaskAudit,
                                    ForAll(
                                        Sort(
                                            Filter(CORMS_AuditLog, ObjectId = varCurrentTask.ReferenceNo || ObjectId = Text(varCurrentTask.ID)),
                                            Created,
                                            SortOrder.Descending
                                        ),
                                        {
                                            ID: ThisRecord.ID,
                                            Action: ThisRecord.Action,
                                            ActorName: ThisRecord.Actor.DisplayName,
                                            Details: ThisRecord.Details,
                                            Created: ThisRecord.Created
                                        }
                                    )
                                );
                                ClearCollect(
                                    colTaskEvents,
                                    ForAll(
                                        Sort(
                                            Filter(
                                                CORMS_Timeline,
                                                CorrespondenceId = varCurrentTask.ReferenceNo ||
                                                (!IsBlank(varCurrentTask.RelatedCorrespondenceId) && CorrespondenceId = varCurrentTask.RelatedCorrespondenceId)
                                            ),
                                            Created,
                                            SortOrder.Ascending
                                        ),
                                        {
                                            Title: ThisRecord.Title,
                                            EventType: ThisRecord.EventType.Value,
                                            Description: ThisRecord.Description,
                                            Created: ThisRecord.Created,
                                            ActorName: ThisRecord.Actor.DisplayName,
                                            IsTaskNote: ThisRecord.Title = "Note" && ThisRecord.CorrespondenceId = varCurrentTask.ReferenceNo
                                        }
                                    )
                                );
                                Select(btnDetCancelEdit);
                                Set(varIsLoading, false)
                              Text: ="Save Changes"
                              Width: =150
                  - recDetDetailsLine:
                      Control: Rectangle
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =RGBA(229, 231, 235, 1)
                        Height: =1
                        LayoutMinHeight: =1
                  - conDetFieldTable:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =18
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conDetFieldHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 112, 204, 1)
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnHcDetHeadField:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Filter Field"
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    BasePaletteColor: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Icon: ="Filter"
                                    IconStyle: =If(IsBlank(locFltDetField), IconStyle.Outline, IconStyle.Filled)
                                    Layout: =ButtonLayout.IconAfter
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({locFltRowDetails: !locFltRowDetails})
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    Size: =14
                                    Text: ="FIELD"
                                    Tooltip: ="Filter"
                                    Width: =255
                              - btnHcDetHeadValue:
