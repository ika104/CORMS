                                                      FillPortions: =1
                                                      ItemDisplayText: =Trim(ThisItem.ReferenceNo & "  " & ThisItem.Title)
                                                      Items: |-
                                                        =With(
                                                            {
                                                                all: nfSeeAllLevels, me: User().Email,
                                                                l1: nfLvl1, l2: nfLvl2, l3: nfLvl3, l4: nfLvl4, l5: nfLvl5, l6: nfLvl6,
                                                                l7: nfLvl7, l8: nfLvl8, l9: nfLvl9, l10: nfLvl10, l11: nfLvl11, l12: nfLvl12,
                                                                s1: nfSt1, s2: nfSt2, s3: nfSt3, s4: nfSt4, s5: nfSt5, s6: nfSt6, s7: nfSt7, s8: nfSt8, s9: nfSt9, s10: nfSt10,
                                                                s11: nfSt11, s12: nfSt12, s13: nfSt13, s14: nfSt14, s15: nfSt15, s16: nfSt16, s17: nfSt17, s18: nfSt18, s19: nfSt19, s20: nfSt20
                                                            },
                                                            // Only after the SharePoint query: the user's own untitled drafts, which have no reference
                                                            // number either, would show as blank rows.
                                                            Filter(
                                                                Sort(
                                                                    Filter(
                                                                        CORMS_Correspondence,
