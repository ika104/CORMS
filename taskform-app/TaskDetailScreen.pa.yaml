                                                                            SecurityLevel.Value = l1 || SecurityLevel.Value = l2 || SecurityLevel.Value = l3 ||
                                                                            SecurityLevel.Value = l4 || SecurityLevel.Value = l5 || SecurityLevel.Value = l6 ||
                                                                            SecurityLevel.Value = l7 || SecurityLevel.Value = l8 || SecurityLevel.Value = l9 ||
                                                                            SecurityLevel.Value = l10 || SecurityLevel.Value = l11 || SecurityLevel.Value = l12
                                                                        ) &&
                                                                        (
                                                                            Status.Value = Blank() || Author.Email = me || Sender.Email = me ||
                                                                            Status.Value = s1 || Status.Value = s2 || Status.Value = s3 || Status.Value = s4 ||
