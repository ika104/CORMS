                                    AlignInContainer: =AlignInContainer.Start
                                    BasePaletteColor: =RGBA(15, 108, 189, 1)
                                    DisplayMode: =If(IsBlank(Trim(inpDetNote.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    OnSelect: |-
                                      =IfError(
                                          Patch(
                                              CORMS_Timeline,
                                              Defaults(CORMS_Timeline),
                                              {
                                                  Title: "Note",
                                                  CorrespondenceId: varCurrentTask.ReferenceNo,
                                                  Actor: fxMe,
                                                  EventTimestamp: Today(),
                                                  Description: Trim(inpDetNote.Text)
                                              }
                                          );
                                          Patch(
                                              CORMS_AuditLog,
                                              Defaults(CORMS_AuditLog),
                                              {
                                                  Title: varCurrentTask.ReferenceNo,
                                                  ObjectId: varCurrentTask.ReferenceNo,
                                                  Action: "Note Added",
                                                  Actor: fxMe,
                                                  Details: Trim(inpDetNote.Text)
                                              }
                                          );
                                          Reset(inpDetNote);
                                          ClearCollect(
                                              colTaskAudit,
                                              ForAll(
                                                  Sort(
                                                      Filter(CORMS_AuditLog, ObjectId = varCurrentTask.ReferenceNo || ObjectId = Text(varCurrentTask.ID)),
                                                      Created,
                                                      SortOrder.Descending
                                                  ),
                                                  {
                                                      ID: ThisRecord.ID,
                                                      Action: ThisRecord.Action,
                                                      ActorName: ThisRecord.Actor.DisplayName,
                                                      Details: ThisRecord.Details,
                                                      Created: ThisRecord.Created
                                                  }
                                              )
                                          );
                                          ClearCollect(
                                              colTaskEvents,
                                              ForAll(
                                                  Sort(
                                                      Filter(
                                                          CORMS_Timeline,
                                                          CorrespondenceId = varCurrentTask.ReferenceNo ||
                                                          (!IsBlank(varCurrentTask.RelatedCorrespondenceId) && CorrespondenceId = varCurrentTask.RelatedCorrespondenceId)
                                                      ),
                                                      Created,
                                                      SortOrder.Ascending
                                                  ),
                                                  {
                                                      Title: ThisRecord.Title,
                                                      EventType: ThisRecord.EventType.Value,
                                                      Description: ThisRecord.Description,
                                                      Created: ThisRecord.Created,
                                                      ActorName: ThisRecord.Actor.DisplayName,
                                                      IsTaskNote: ThisRecord.Title = "Note" && ThisRecord.CorrespondenceId = varCurrentTask.ReferenceNo
                                                  }
                                              )
                                          );
