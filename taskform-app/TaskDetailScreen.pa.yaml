                                          StartsWith(ThisItem.Title, "Linked"), RGBA(237, 235, 233, 1),
                                          StartsWith(ThisItem.Title, "Due"), RGBA(253, 231, 233, 1),
                                          StartsWith(ThisItem.Title, "Approved"), RGBA(223, 246, 221, 1),
                                          StartsWith(ThisItem.Title, "Rejected"), RGBA(253, 231, 233, 1),
