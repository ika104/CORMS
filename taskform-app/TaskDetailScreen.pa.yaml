                                                      Visible: =varEditField = "team" && ThisItem.Key = "team"
                                                - cbDetMember:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AccessibleLabel: ="Team Member"
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: |-
                                                        =// Current assignees, looked up in the directory so they match the search results' shape
                                                        Filter(
                                                            ForAll(
                                                                Filter(varCurrentTask.AssignedToUser, !IsBlank(Email)),
                                                                IfError(Office365Users.UserProfile(ThisRecord.Email), Blank())
                                                            ),
                                                            !IsBlank(Mail)
                                                        )
                                                      FillPortions: =1
                                                      ItemDisplayText: =ThisItem.DisplayName
                                                      Items: |-
                                                        =// Active internal Office 365 / Entra ID users with a mailbox (guests excluded), searched as the user types
                                                        Filter(
                                                            Office365Users.SearchUserV2(
                                                                {
                                                                    searchTerm: Trim(cbDetMember.SearchText),
                                                                    top: 50,
                                                                    isSearchTermRequired: false
                                                                }
                                                            ).value,
                                                            AccountEnabled && !IsBlank(Mail) && !("#EXT#" in Upper(UserPrincipalName))
