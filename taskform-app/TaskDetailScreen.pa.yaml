Screens:
  TaskDetailScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varTab, "Details");
        Reset(tabDet);
        Set(varEditField, "");
        Reset(inpFltDetField); Reset(inpFltDetValue); Reset(inpFltFilesName); Reset(inpFltFilesDate); Reset(inpFltFilesSource); Reset(inpFltSecPrincipal); Reset(inpFltSecLevel); Reset(inpFltSecType); Reset(inpFltAuditNo); Reset(inpFltAuditAction); Reset(inpFltAuditActor); Reset(inpFltAuditDetails); Reset(inpFltAuditTime); UpdateContext({locFltDetField: "", locFltDetValue: "", locFltFilesName: "", locFltFilesDate: "", locFltFilesSource: "", locFltSecPrincipal: "", locFltSecLevel: "", locFltSecType: "", locFltAuditNo: "", locFltAuditAction: "", locFltAuditActor: "", locFltAuditDetails: "", locFltAuditTime: ""});
        UpdateContext({locFltRowDetails: false, locFltRowFiles: false, locFltRowSecurity: false, locFltRowAudit: false});
        UpdateContext(
            {
                locDirty: false,
                locSubject: "", locSubjectSet: false,
                locDescription: "", locDescSet: false,
                locTeam: "", locTeamSet: false,
                locDue: Blank(), locDueSet: false,
                locCorr: Blank(), locCorrSet: false,
                locType: Blank(), locStatus: Blank(), locPriority: Blank(), locMember: Blank(), locMemberSet: false
            }
        );
        Set(varTaskId, Value(Coalesce(Param("taskId"), "0")));
        Select(btnDetRefresh)
    Children:
      - conDetRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conDetTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 108, 191, 1)
                  FillPortions: =0
                  Height: =50
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  PaddingLeft: =16
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtDetTopRef:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMinWidth: =120
                        Size: =14
                        Text: =varCurrentTask.ReferenceNo
                        Width: =200
                  - txtDetTopSubject:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Align: =Align.Right
                        Color: =RGBA(255, 255, 255, 0.9)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        LayoutMinWidth: =0
                        Size: =13
                        Text: =varCurrentTask.Title
                        Wrap: =false
            - tabDet:
                Control: ModernTabList
                Properties:
                  AccessibleLabel: ="Task sections"
                  AlignInContainer: =AlignInContainer.Stretch
                  BasePaletteColor: =RGBA(15, 108, 189, 1)
                  Default: |-
                    ={Value: "Details"}
                  Font: =Font.'Segoe UI'
                  Height: =46
                  Items: |-
                    =Table(
                        {Value: "Details"},
                        {Value: "Files"},
                        {Value: "Notes"},
                        {Value: "Security"},
                        {Value: "Audit"},
                        {Value: "Timeline"}
                    )
                  LayoutMinHeight: =46
                  LayoutMinWidth: =0
                  OnChange: =Set(varTab, Self.Selected.Value)
                  PaddingLeft: =8
                  TabSize: =TabSize.Medium
            - divDetTabLine:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(229, 231, 235, 1)
                  FillPortions: =0
                  Height: =1
                  LayoutMinHeight: =1
            - conDetDetails:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =varTab = "Details"
                Children:
                  - conDetDetailsHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =24
                        PaddingRight: =24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtDetDetailsTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(36, 36, 36, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinWidth: =0
                              Size: =17
                              Text: ="Details"
                        - btnFltClearDetails:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Clear the details filters"
                              Appearance: =ButtonAppearance.Outline
                              Height: =34
                              Icon: ="FilterDismiss"
                              OnSelect: |-
                                =Reset(inpFltDetField); Reset(inpFltDetValue); UpdateContext({locFltDetField: "", locFltDetValue: ""})
                              Text: ="Clear filters"
                              Visible: =!IsBlank(locFltDetField) || !IsBlank(locFltDetValue)
                              Width: =140
                        - txtDetOverdue:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              BorderColor: =RGBA(238, 172, 178, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(196, 43, 28, 1)
                              Fill: =RGBA(253, 231, 233, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =14
                              Text: ="⚠ Overdue"
                              Visible: =varIsOverdue
                              Width: =120
                        - btnDetCancelEdit:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =Self.Text
                              Appearance: =ButtonAppearance.Outline
                              Height: =34
                              OnSelect: |-
                                =Set(varEditField, "");
                                UpdateContext(
                                    {
                                        locDirty: false,
                                        locSubject: "", locSubjectSet: false,
                                        locDescription: "", locDescSet: false,
                                        locTeam: "", locTeamSet: false,
                                        locDue: Blank(), locDueSet: false,
                                        locCorr: Blank(), locCorrSet: false,
                                        locType: Blank(), locStatus: Blank(), locPriority: Blank(), locMember: Blank(), locMemberSet: false
                                    }
                                )
                              Text: ="Cancel"
                              Visible: =locDirty || !IsBlank(varEditField)
                              Width: =90
                        - btnDetSave:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =Self.Text
                              BasePaletteColor: =RGBA(15, 108, 189, 1)
                              DisplayMode: =If(locDirty && !varIsLoading, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =34
                              Icon: ="Save"
                              OnSelect: |-
                                =Set(varIsLoading, true);
                                With(
                                  {
                                    locOldStatus: varCurrentTask.Status.Value,
                                    locNewStatus: Coalesce(locStatus.Value, varCurrentTask.Status.Value),
                                    locOldMember: Concat(varCurrentTask.AssignedToUser, DisplayName, ", "),
                                    locChanges: Concat(
                                      Filter(
                                        Table(
                                          { F: "Subject", C: locSubjectSet },
                                          { F: "Type", C: !IsBlank(locType) },
                                          { F: "Priority", C: !IsBlank(locPriority) },
                                          { F: "Assignee Team", C: locTeamSet },
                                          { F: "Team Member", C: locMemberSet },
                                          { F: "Due Date", C: locDueSet },
                                          { F: "Related Correspondence", C: locCorrSet },
                                          { F: "Description", C: locDescSet }
                                        ),
                                        C
                                      ),
                                      F,
                                      ", "
                                    )
                                  },
                                  IfError(
                                    Patch(
                                      CORMS_Tasks,
                                      varCurrentTask,
                                      {
                                        Title: If(locSubjectSet, Trim(locSubject), varCurrentTask.Title),
                                        TaskType: If(IsBlank(locType), varCurrentTask.TaskType, locType),
                                        Status: { Value: locNewStatus },
                                        Priority: If(IsBlank(locPriority), varCurrentTask.Priority, locPriority),
                                        AssignedToTeam: If(locTeamSet, locTeam, varCurrentTask.AssignedToTeam),
                                        DueDate: If(locDueSet, locDue, varCurrentTask.DueDate),
                                        RelatedCorrespondenceId: If(
                                          locCorrSet,
                                          If(IsBlank(locCorr), "", Text(locCorr.ID)),
                                          varCurrentTask.RelatedCorrespondenceId
                                        ),
                                        Description: If(locDescSet, locDescription, varCurrentTask.Description)
                                      }
                                    );
                                    // Assignees picked from the directory -> SharePoint person values.
                                    If(
                                      locMemberSet,
                                      Patch(
                                        CORMS_Tasks,
                                        LookUp(CORMS_Tasks, ID = varTaskId),
                                        {
                                          AssignedToUser: ForAll(
                                            locMember,
                                            {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(ThisRecord.UserPrincipalName),
                                              Department: Coalesce(ThisRecord.Department, ""),
                                              DisplayName: ThisRecord.DisplayName,
                                              Email: ThisRecord.Mail,
                                              JobTitle: Coalesce(ThisRecord.JobTitle, ""),
                                              Picture: ""
                                            }
                                          )
                                        }
                                      )
                                    );
                                    If(
                                        nfAuditOn,
                                        IfError(
                                            If(
                                                'CORMS-AuditBridge'.Run(
                                                    nfAuditEndpoint,
                                                    nfAuditKey,
                                                    fxAuditDoc(
                                                        varCurrentTask.ReferenceNo,
                                                        If(locOldStatus = locNewStatus, "Task Updated", "Status Changed"),
                                                        If(
                                                            locOldStatus = locNewStatus,
                                                            "Updated: " & locChanges,
                                                            "Status changed from " & locOldStatus & " to " & locNewStatus &
                                                            If(IsBlank(locChanges), "", ". Updated: " & locChanges)
                                                            )
                                                    ),
                                                    {text_1: nfAuditIndex}
                                                ).ok <> "true",
                                                Trace("Audit entry could not be written", TraceSeverity.Warning, {action: "Task audit"})
                                            ),
                                            Trace("Audit entry could not be written", TraceSeverity.Warning, {action: "Task audit"})
                                        )
                                    );
                                    // CMS-052.4: every edit shows on the timeline too.
                                    If(
                                      !IsBlank(locChanges),
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Task updated",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Now(),
                                          Description: "Changed: " & locChanges
                                        }
                                      )
                                    );
                                    If(
                                      locOldStatus <> locNewStatus,
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Status changed to " & locNewStatus,
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Now(),
                                          Description: "Previous status " & locOldStatus
                                        }
                                      )
                                    );
                                    If(
                                      locMemberSet && Concat(locMember, DisplayName, ", ") <> locOldMember,
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Assigned",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Now(),
                                          Description: "Assigned to " & Concat(locMember, DisplayName, ", ")
                                        }
                                      )
                                    );
                                    If(
                                      locCorrSet && !IsBlank(locCorr),
                                      Patch(
                                        CORMS_Timeline,
                                        Defaults(CORMS_Timeline),
                                        {
                                          Title: "Linked",
                                          CorrespondenceId: varCurrentTask.ReferenceNo,
                                          Actor: fxMe,
                                          EventTimestamp: Now(),
                                          Description: "Linked to correspondence " & locCorr.ReferenceNo
                                        }
                                      )
                                    );
                                    Notify("Changes saved.", NotificationType.Success),

                                    Trace("Task save failed", TraceSeverity.Error, {task: varCurrentTask.ReferenceNo, error: FirstError.Message});
                                    Notify("The changes couldn't be saved. Please try again.", NotificationType.Error)
                                  )
                                );
                                Set(varEditField, "");
                                UpdateContext(
                                    {
                                        locDirty: false,
                                        locSubject: "", locSubjectSet: false,
                                        locDescription: "", locDescSet: false,
                                        locTeam: "", locTeamSet: false,
                                        locDue: Blank(), locDueSet: false,
                                        locCorr: Blank(), locCorrSet: false,
                                        locType: Blank(), locStatus: Blank(), locPriority: Blank(), locMember: Blank(), locMemberSet: false
                                    }
                                );
                                Select(btnDetRefresh)
                              Text: ="Save Changes"
                              Width: =150
                  - divDetDetailsLine:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(229, 231, 235, 1)
                        FillPortions: =0
                        Height: =1
                        LayoutMinHeight: =1
                  - conDetFieldTable:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =18
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conDetFieldHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0, 112, 204, 1)
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnHcDetHeadField:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Filter Field"
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    BasePaletteColor: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Icon: ="Filter"
                                    IconStyle: =If(IsBlank(locFltDetField), IconStyle.Outline, IconStyle.Filled)
                                    Layout: =ButtonLayout.IconAfter
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({locFltRowDetails: !locFltRowDetails})
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    Size: =14
                                    Text: ="FIELD"
                                    Tooltip: ="Filter"
                                    Width: =255
                              - btnHcDetHeadValue:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Filter Value"
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    BasePaletteColor: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Icon: ="Filter"
                                    IconStyle: =If(IsBlank(locFltDetValue), IconStyle.Outline, IconStyle.Filled)
                                    Layout: =ButtonLayout.IconAfter
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({locFltRowDetails: !locFltRowDetails})
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    Size: =14
                                    Text: ="VALUE"
                                    Tooltip: ="Filter"
                        - conFltRowDetails:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(199, 224, 244, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(235, 243, 252, 1)
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =18
                              PaddingRight: =18
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =locFltRowDetails
                            Children:
                              - inpFltDetField:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Filter Field"
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(214, 221, 224, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =UpdateContext({locFltDetField: Self.Text})
                                    Placeholder: ="Filter Field..."
                                    Size: =13
                                    Type: =TextInputType.Search
                                    Width: =255
                              - inpFltDetValue:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Filter Value"
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(214, 221, 224, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =1
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =UpdateContext({locFltDetValue: Self.Text})
                                    Placeholder: ="Filter Value..."
                                    Size: =13
                                    Type: =TextInputType.Search
                        - txtFltEmptyDetails:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(79, 90, 94, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Italic: =true
                              LayoutMinWidth: =0
                              PaddingLeft: =14
                              Size: =13
                              Text: ="No rows match the filters."
                              Visible: =(!IsBlank(locFltDetField) || !IsBlank(locFltDetValue)) && IsEmpty(Filter(nfDetRows, (IsBlank(locFltDetField) || locFltDetField in Label) && (IsBlank(locFltDetValue) || locFltDetValue in Val)))
                        - galDetFields:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Task details"
                              DelayItemLoading: =false
                              Items: |-
                                =With(
                                    { locShown: Filter(nfDetRows, (IsBlank(locFltDetField) || locFltDetField in Label) && (IsBlank(locFltDetValue) || locFltDetValue in Val)) },
                                    ForAll(Sequence(CountRows(locShown)), Patch(Index(locShown, Value), { Idx: Value }))
                                )
                              LayoutMinHeight: =0
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =55
                            Children:
                              - conDetRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(Mod(ThisItem.Idx, 2) = 0, RGBA(248, 249, 250, 1), RGBA(255, 255, 255, 1))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - conDetRowInner:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          PaddingLeft: =18
                                          PaddingRight: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtDetLabel:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Color: =RGBA(36, 36, 36, 1)
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinWidth: =0
                                                Size: =14
                                                Text: =ThisItem.Label
                                                Width: =255
                                          - conDetValue:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =Parent.Height
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - txtDetValue:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =If(ThisItem.Key = "description" || (ThisItem.Key = "due" && varIsOverdue), RGBA(196, 43, 28, 1), RGBA(51, 51, 51, 1))
                                                      FillPortions: =1
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =If(ThisItem.Key = "description", FontWeight.Bold, FontWeight.Normal)
                                                      LayoutMinWidth: =0
                                                      Size: =14
                                                      Text: |-
                                                        =With(
                                                            {
                                                                locValue: Switch(
                                                                    ThisItem.Key,
                                                                    "ref", varCurrentTask.ReferenceNo,
                                                                    "subject", varCurrentTask.Title,
                                                                    "type", varCurrentTask.TaskType.Value,
                                                                    "team", varCurrentTask.AssignedToTeam,
                                                                    "member", Concat(varCurrentTask.AssignedToUser, DisplayName, ", "),
                                                                    "createdby", varCurrentTask.'Created By'.DisplayName,
                                                                    "created", Text(varCurrentTask.Created, "yyyy-mm-dd hh:mm"),
                                                                    "modified", Text(varCurrentTask.Modified, "yyyy-mm-dd hh:mm"),
                                                                    "due", If(
                                                                        IsBlank(varCurrentTask.DueDate),
                                                                        "",
                                                                        Text(varCurrentTask.DueDate, "yyyy-mm-dd") & If(varIsOverdue, " · Overdue", "")
                                                                    ),
                                                                    "description", varCurrentTask.Description,
                                                                    ""
                                                                )
                                                            },
                                                            If(IsBlank(Trim(locValue)), "—", locValue)
                                                        )
                                                      Visible: |-
                                                        =varEditField <> ThisItem.Key &&
                                                        !(ThisItem.Key in ["status", "priority", "attach"]) &&
                                                        !(ThisItem.Key = "corr" && !IsBlank(varRelCorr))
                                                      Wrap: =false
                                                - txtDetChip:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Align: =Align.Center
                                                      Color: |-
                                                        =Switch(
                                                            If(ThisItem.Key = "status", varCurrentTask.Status.Value, varCurrentTask.Priority.Value),
                                                            "Pending", RGBA(196, 110, 0, 1),
                                                            "In Progress", RGBA(15, 108, 189, 1),
                                                            "Completed", RGBA(16, 124, 16, 1),
                                                            "Overdue", RGBA(196, 43, 28, 1),
                                                            "Rejected", RGBA(196, 43, 28, 1),
                                                            "High", RGBA(196, 43, 28, 1),
                                                            "Normal", RGBA(15, 108, 189, 1),
                                                            "Low", RGBA(16, 124, 16, 1),
                                                            RGBA(79, 90, 94, 1)
                                                        )
                                                      Fill: |-
                                                        =Switch(
                                                            If(ThisItem.Key = "status", varCurrentTask.Status.Value, varCurrentTask.Priority.Value),
                                                            "Pending", RGBA(255, 244, 206, 1),
                                                            "In Progress", RGBA(222, 236, 249, 1),
                                                            "Completed", RGBA(223, 246, 221, 1),
                                                            "Overdue", RGBA(253, 231, 233, 1),
                                                            "Rejected", RGBA(253, 231, 233, 1),
                                                            "High", RGBA(253, 231, 233, 1),
                                                            "Normal", RGBA(222, 236, 249, 1),
                                                            "Low", RGBA(223, 246, 221, 1),
                                                            RGBA(243, 242, 241, 1)
                                                        )
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =30
