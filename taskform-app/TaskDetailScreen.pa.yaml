                                          "created" in Lower(ThisItem.Title), RGBA(222, 236, 249, 1),
                                          "submit" in Lower(ThisItem.Title), RGBA(237, 235, 233, 1),
                                          "review" in Lower(ThisItem.Title), RGBA(255, 244, 206, 1),
                                          RGBA(222, 236, 249, 1)
                                      )
