                                          StartsWith(ThisItem.Title, "Due"), RGBA(196, 43, 28, 1),
                                          StartsWith(ThisItem.Title, "Approved"), RGBA(16, 124, 16, 1),
                                          StartsWith(ThisItem.Title, "Rejected"), RGBA(196, 43, 28, 1),
                                          ThisItem.Title = "Note", RGBA(92, 46, 145, 1),
                                          "created" in Lower(ThisItem.Title), RGBA(15, 108, 189, 1),
                                          "submit" in Lower(ThisItem.Title), RGBA(96, 94, 92, 1),
                                          "review" in Lower(ThisItem.Title), RGBA(196, 110, 0, 1),
                                          RGBA(15, 108, 189, 1)
                                      )
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =17
                                    RadiusBottomRight: =17
                                    RadiusTopLeft: =17
                                    RadiusTopRight: =17
                                    Width: =34
                                    X: =24
                                    Y: =4
      - btnDetRefresh:
          Control: ModernButton
          Properties:
            AccessibleLabel: ="Reload the task"
            Height: =1
            OnSelect: |-
              =// Everything the tabs show, read again from SharePoint. Called last by the handlers that write.
              Set(varIsLoading, true);
              Set(varCurrentTask, LookUp(CORMS_Tasks, ID = varTaskId));
              Set(
                  varIsOverdue,
                  !IsBlank(varCurrentTask.DueDate) && varCurrentTask.DueDate < Today() &&
                  !(varCurrentTask.Status.Value in ["Completed", "Rejected"])
              );
              // Related correspondence (stored as its ID; older tasks may hold the reference number).
              Set(
                  varRelCorr,
                  If(
                      IsBlank(varCurrentTask.RelatedCorrespondenceId),
                      Blank(),
                      IsNumeric(varCurrentTask.RelatedCorrespondenceId),
                      LookUp(CORMS_Correspondence, ID = Value(varCurrentTask.RelatedCorrespondenceId)),
                      LookUp(CORMS_Correspondence, ReferenceNo = varCurrentTask.RelatedCorrespondenceId)
                  )
              );
              // Keys for the reads below. A task without a reference must match nothing, not every blank row.
              Set(varTaskRef, Coalesce(varCurrentTask.ReferenceNo, "#none#"));
              // Files = documents uploaded for this task (CORMS_Attachments.TaskReferenceNo)
              //         + documents of its related correspondence (CORMS_Attachments.CorrespondenceId).
              ClearCollect(
                  colTaskFiles,
                  ForAll(
                      Filter(CORMS_Attachments, TaskReferenceNo = varTaskRef),
                      {
                          DocId: ThisRecord.ID,
                          FileName: Coalesce(ThisRecord.FileName, ThisRecord.Name),
                          Uploaded: ThisRecord.Created,
                          Url: fxDownloadUrl(ThisRecord.'Full Path'),
                          Source: "Task",
                          Link: ThisRecord.'Link to item',
                          IsMain: false
                      }
                  )
              );
              If(
                  !IsBlank(varRelCorr),
                  Collect(
                      colTaskFiles,
                      ForAll(
                          Filter(
                              CORMS_Attachments,
                              CorrespondenceId = Text(varRelCorr.ID) || CorrespondenceId = varRelCorr.ReferenceNo
                          ),
                          {
                              DocId: ThisRecord.ID,
                              FileName: Coalesce(ThisRecord.FileName, ThisRecord.Name),
                              Uploaded: ThisRecord.Created,
                              Url: fxDownloadUrl(ThisRecord.'Full Path'),
                              Source: "Correspondence",
                              Link: ThisRecord.'Link to item',
                              IsMain: ThisRecord.IsMainLetter
                          }
                      )
                  )
              );
              // A task file linked to the same correspondence would otherwise be listed twice.
              RemoveIf(colTaskFiles, Source = "Correspondence" && DocId in Filter(colTaskFiles, Source = "Task").DocId);
              // The task's audit entries, from the CORMS audit index. Numbered like CORMS's Audit tab:
              // AUD-0001 is the oldest shown.
              Set(
                  varTaskAuditHits,
                  If(
                      nfAuditOn && varTaskRef <> "#none#",
                      IfError(
                          With(
                              {
                                  r: 'CORMS-AuditSearch'.Run(
                                      nfAuditEndpoint,
                                      nfAuditKey,
                                      fxAuditQuery(varTaskRef),
                                      {text_1: nfAuditIndex}
                                  )
                              },
                              If(
                                  r.ok = "true",
                                  Table(ParseJSON(r.hits)),
                                  Trace("Task audit could not be read", TraceSeverity.Warning, {status: r.status});
                                  Blank()
                              )
                          ),
                          Trace("Task audit could not be read", TraceSeverity.Warning, {task: varTaskRef});
                          Blank()
                      )
                  )
              );
              Set(
                  varTaskAudit,
                  ForAll(
                      Sequence(CountRows(varTaskAuditHits)) As n,
                      With(
                          { h: Index(varTaskAuditHits, n.Value).Value._source },
                          {
                              ID: "AUD-" & Text(CountRows(varTaskAuditHits) - n.Value + 1, "0000"),
                              Action: Text(h.action),
                              ActorName: Text(h.userName),
                              Details: Text(h.Details),
                              Created: DateTimeValue(Text(h.timestamp))
                          }
                      )
                  )
              );
              Set(
                  varTaskEvents,
                  ForAll(
                      // Newest first; events recorded in the same second by the order they were written.
                      SortByColumns(
                          Filter(
                              CORMS_Timeline,
                              CorrespondenceId = varTaskRef ||
                              (!IsBlank(varCurrentTask.RelatedCorrespondenceId) && CorrespondenceId = varCurrentTask.RelatedCorrespondenceId)
                          ),
                          "Created",
                          SortOrder.Descending,
                          "ID",
                          SortOrder.Descending
                      ),
                      {
                          ID: ThisRecord.ID,
                          Title: ThisRecord.Title,
                          EventType: ThisRecord.EventType.Value,
                          Description: ThisRecord.Description,
                          Created: ThisRecord.Created,
                          ActorName: ThisRecord.Actor.DisplayName,
                          IsTaskNote: ThisRecord.Title = "Note" && ThisRecord.CorrespondenceId = varTaskRef
                      }
                  )
              );
              Set(varIsLoading, false)
            Visible: =false
            Width: =1
            X: =-200
            Y: =-200
      - conDetBusy:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 0.7)
            Height: =Parent.Height
            Visible: =varIsLoading
            Width: =Parent.Width
          Children:
            - spnDetBusy:
                Control: ModernSpinner
                Properties:
                  AccessibleLabel: ="Working, please wait"
                  Height: =96
                  Label: ="Please wait..."
                  LabelPosition: =SpinnerLabelPosition.Below
                  Width: =200
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
