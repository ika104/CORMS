                                                                            Status.Value = s9 || Status.Value = s10 || Status.Value = s11 || Status.Value = s12 ||
                                                                            Status.Value = s13 || Status.Value = s14 || Status.Value = s15 || Status.Value = s16 ||
                                                                            Status.Value = s17 || Status.Value = s18 || Status.Value = s19 || Status.Value = s20
                                                                        )
                                                                    ),
                                                                    ID,
                                                                    SortOrder.Descending
                                                                ),
                                                                !IsBlank(Trim(ReferenceNo & Title))
                                                            )
